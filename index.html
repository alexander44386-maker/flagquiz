  #1a0533;display:none;}
.scanlines{display:none;}
.vignette{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 4px rgba(255,255,255,0.45), inset 0 0 24px 6px rgba(124,58,237,0.35);border-radius:inherit;}
.countdown-overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:22;pointer-events:none;background:rgba(10,5,26,0.40);}
.countdown-overlay.show{display:flex;}
.countdown-num{font-family:var(--font-disp);font-weight:800;font-size:min(30vw,150px);color:#fff;text-shadow:0 4px 18px rgba(0,0,0,0.4);}
.countdown-num.go{color:var(--green);}
@keyframes countdownPop{0%{transform:scale(0.4);opacity:0;}55%{transform:scale(1.18);opacity:1;}100%{transform:scale(1);opacity:1;}}
.countdown-num.pulse{animation:countdownPop .35s cubic-bezier(.22,.9,.25,1.35);}

/* Camera now lives in its own dedicated panel instead of filling the whole screen */
.camera-panel{position:relative;flex:1;min-height:0;min-width:0;border-radius:18px;overflow:hidden;background:#231447;box-shadow:0 6px 20px rgba(0,0,0,0.4);border:3px solid var(--cyan);}
.camera-slot{flex:1;min-height:0;display:flex;flex-direction:column;}

.game-layout{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 14px calc(10px + env(safe-area-inset-bottom));}
.hud-top{display:flex;justify-content:space-between;align-items:flex-start;font-family:var(--font-mono);flex:none;}
.hud-pill{background:var(--panel);border:1px solid var(--hairline);border-radius:10px;padding:7px 12px;font-size:12px;letter-spacing:0.5px;backdrop-filter:blur(4px);font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,0.25);}
.hud-pill.score{color:var(--amber);}
.hud-pill .lbl{color:var(--text-mut);margin-right:6px;font-size:10px;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
.hud-right{display:flex;gap:6px;}
.rec-pill{display:flex;align-items:center;gap:7px;border:1px solid var(--hairline);color:var(--text-mut);}
.rec-dot{width:8px;height:8px;border-radius:50%;background:var(--red);flex:none;opacity:0.55;}
.rec-pill.recording{border-color:var(--red);background:rgba(255,75,75,0.18);color:var(--text-hi);}
.rec-pill.recording .rec-dot{opacity:1;box-shadow:0 0 8px var(--red);animation:pulse 1s infinite;}
.rec-pill:disabled{opacity:0.35;}

.progress-track{height:5px;background:rgba(255,255,255,0.25);border-radius:3px;margin-top:10px;overflow:hidden;flex:none;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--cyan-dark));width:0%;transition:width .3s;}

/* Compact flag strip pinned to the top — no longer fills the screen */
.flag-panel{flex:none;display:flex;flex-direction:column;align-items:center;padding:2px 0 4px;position:relative;}
.cam-flag-wrap{position:absolute;top:5%;left:50%;transform:translateX(-50%);display:none;flex-direction:column;align-items:center;gap:5px;z-index:12;}
.camera-panel.in-game .cam-flag-wrap{display:flex;}
.reticle{position:relative;width:min(38vw,150px);aspect-ratio:16/10;filter:drop-shadow(0 6px 14px rgba(0,0,0,0.4));}
.reticle-corner{position:absolute;width:18px;height:18px;border:2px solid var(--amber);opacity:0;transition:all .4s cubic-bezier(.2,.8,.2,1);}
.reticle-corner.tl{top:-6px;left:-6px;border-right:none;border-bottom:none;}
.reticle-corner.tr{top:-6px;right:-6px;border-left:none;border-bottom:none;}
.reticle-corner.bl{bottom:-6px;left:-6px;border-right:none;border-top:none;}
.reticle-corner.br{bottom:-6px;right:-6px;border-left:none;border-top:none;}
.reticle.locked .reticle-corner{opacity:1;top:0;left:0;}
.reticle.locked .reticle-corner.tl{top:-6px;left:-6px;}
.reticle.locked .reticle-corner.tr{top:-6px;right:-6px;}
.reticle.locked .reticle-corner.bl{bottom:-6px;left:-6px;}
.reticle.locked .reticle-corner.br{bottom:-6px;right:-6px;}
.flag-frame{width:100%;height:100%;border-radius:8px;overflow:hidden;background:linear-gradient(135deg,#3D2E66,#2D1054);box-shadow:0 6px 18px rgba(0,0,0,0.35);position:relative;}
#flag-img{width:100%;height:100%;object-fit:contain;display:block;opacity:0;transition:opacity .35s;}
#flag-img.show{opacity:1;}
.sweep{position:absolute;left:0;right:0;height:40%;background:linear-gradient(to bottom, transparent, rgba(255,255,255,0.45), transparent);top:-40%;animation:sweep 1.1s linear infinite;}
.reticle.locked .sweep{display:none;}
@keyframes sweep{from{top:-40%;}to{top:100%;}}
.scan-caption{font-family:var(--font-mono);font-size:10px;letter-spacing:1px;color:var(--amber);text-transform:uppercase;margin-top:5px;min-height:13px;font-weight:700;}
.q-title{font-size:12px;color:var(--text-mut);margin-top:2px;text-align:center;font-weight:700;}

.drop-zone{position:relative;width:min(46vw,180px);min-height:32px;margin:0 auto 8px;transform:translateY(-5vh);border:2px dashed rgba(255,255,255,0.75);border-radius:9px;display:flex;align-items:center;justify-content:center;background:rgba(10,5,26,0.55);backdrop-filter:blur(2px);transition:all .15s;box-shadow:0 4px 14px rgba(0,0,0,0.35);}
.drop-zone-label{font-family:var(--font-mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#fff;pointer-events:none;font-weight:700;}
.drop-zone.over{border-color:var(--cyan);border-style:solid;background:rgba(124,58,237,0.35);box-shadow:0 0 18px rgba(124,58,237,0.4);}
.drop-zone.over .drop-zone-label{color:#fff;}
.drop-zone.correct{border-color:var(--green);border-style:solid;background:rgba(88,204,2,0.55);}
.drop-zone.correct .drop-zone-label{color:#0E3A12;}
.drop-zone.wrong{border-color:var(--red);border-style:solid;background:rgba(255,75,75,0.55);}
.drop-zone.wrong .drop-zone-label{color:#4A0E08;}
.drop-zone .letter{font-family:var(--font-mono);font-weight:700;color:var(--amber);border:1px solid var(--amber);border-radius:6px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;flex:none;margin-right:6px;background:rgba(10,5,26,0.55);}
.drop-zone .aname{font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,0.5);}
.drop-zone.correct .letter{border-color:var(--green);color:#0E3A12;background:rgba(255,255,255,0.85);}
.drop-zone.wrong .letter{border-color:var(--red);color:#4A0E08;background:rgba(255,255,255,0.85);}
.drop-zone.correct .aname{color:#0E3A12;text-shadow:none;}
.drop-zone.wrong .aname{color:#4A0E08;text-shadow:none;}

/* Camera is now the dominant visual — choices float inside it as an overlay strip */
.content-row{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;}
.cam-answers{position:absolute;left:0;right:0;bottom:0;z-index:11;padding:22px 10px calc(10px + env(safe-area-inset-bottom));display:none;background:linear-gradient(to top, rgba(10,5,26,0.75) 45%, rgba(10,5,26,0.2) 80%, transparent);}
.camera-panel.in-game .cam-answers{display:block;}
.hint-text{text-align:center;font-family:var(--font-mono);font-size:10.5px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,0.5);letter-spacing:0.3px;margin-bottom:6px;flex:none;font-weight:700;}
.hint-text b{color:var(--amber);}
.answers-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto;gap:8px;}
.answer-tile{background:var(--panel-solid);border:2px solid var(--hairline);border-radius:14px;padding:9px 10px;display:flex;align-items:center;gap:8px;text-align:left;color:var(--text-hi);user-select:none;-webkit-user-select:none;cursor:pointer;transition:opacity .15s, transform .1s;box-shadow:0 3px 0 rgba(0,0,0,0.3);}
.answer-tile.tapped{transform:scale(0.96);}
.answer-tile .letter{font-family:var(--font-mono);font-weight:700;color:#fff;background:var(--cyan);border:none;border-radius:6px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:12px;flex:none;pointer-events:none;}
.answer-tile .aname{font-size:13px;font-weight:700;line-height:1.25;pointer-events:none;}
.answer-tile.correct{border-color:var(--green);background:rgba(88,204,2,0.20);}
.answer-tile.correct .letter{background:var(--green);}
.answer-tile.wrong{border-color:var(--red);background:rgba(255,75,75,0.20);}
.answer-tile.wrong .letter{background:var(--red);}
.answer-tile.placeholder{visibility:hidden;}
.answer-tile:disabled{opacity:1;}

.exit-btn{position:absolute;top:calc(14px + env(safe-area-inset-top));left:14px;background:var(--panel);border:1px solid var(--hairline);border-radius:10px;width:34px;height:34px;color:var(--text-mut);font-size:16px;display:none;z-index:40;box-shadow:0 2px 8px rgba(0,0,0,0.3);}
.pause-overlay{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;background:rgba(10,5,26,0.86);backdrop-filter:blur(3px);}
.pause-card{display:flex;flex-direction:column;align-items:center;gap:18px;padding:30px 36px;background:var(--panel-solid,#231447);border:2px solid var(--cyan);border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,0.5);}
.pause-title{font-family:var(--font-mono);font-weight:800;font-size:20px;letter-spacing:1px;color:#fff;}
.pause-resume-btn{font-family:var(--font-mono);font-weight:800;font-size:15px;letter-spacing:0.5px;color:#0D0F1A;background:var(--cyan);border:none;border-radius:999px;padding:12px 26px;cursor:pointer;}
#game-screen.paused .cam-answers, #game-screen.paused .drop-zone{pointer-events:none;}
.top-spacer{height:34px;}

/* ---------- REACTION OVERLAY ---------- */
.reaction-overlay{position:absolute;top:36%;left:50%;transform:translate(-50%,-50%) scale(0.55);z-index:30;pointer-events:none;opacity:0;display:flex;align-items:flex-start;justify-content:center;}
.reaction-overlay.show{animation:reactionPop .5s cubic-bezier(.22,.9,.25,1.35) forwards;}
.reaction-card{background:var(--panel-solid);border:2px solid var(--hairline);border-radius:18px;padding:18px 28px;display:flex;flex-direction:column;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,0.4);min-width:180px;}
.reaction-overlay.correct .reaction-card{border-color:var(--green);box-shadow:0 10px 30px rgba(88,204,2,0.35);}
.reaction-overlay.wrong .reaction-card{border-color:var(--red);box-shadow:0 10px 30px rgba(255,75,75,0.35);}
.reaction-icon{font-size:38px;line-height:1;}
.reaction-overlay.correct .reaction-icon{color:var(--green);}
.reaction-overlay.wrong .reaction-icon{color:var(--red);}
.reaction-text{font-size:16px;font-weight:800;margin-top:8px;text-align:center;color:var(--text-hi);}
.reaction-overlay.correct .reaction-text{color:var(--green);}
.reaction-overlay.wrong .reaction-text{color:var(--red);}
.reaction-sub{font-family:var(--font-mono);font-size:11px;color:var(--text-mut);margin-top:6px;text-align:center;letter-spacing:0.5px;font-weight:700;}
.reaction-sub b{color:var(--amber);}
.reaction-plus{position:absolute;top:-8px;right:-10px;font-family:var(--font-mono);font-weight:700;font-size:19px;color:var(--green);opacity:0;text-shadow:0 0 10px rgba(88,204,2,0.6);}
.reaction-plus.show{animation:plusFloat 1.1s ease-out forwards;}
@keyframes reactionPop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(0.5);}
  55%{opacity:1;transform:translate(-50%,-50%) scale(1.12);}
  75%{transform:translate(-50%,-50%) scale(0.95);}
  100%{opacity:1;transform:translate(-50%,-50%) scale(1);}
}
@keyframes plusFloat{
  0%{opacity:0;transform:translateY(0) scale(0.6);}
  25%{opacity:1;transform:translateY(-4px) scale(1.25);}
  100%{opacity:0;transform:translateY(-30px) scale(1);}
}

/* ---------- HYPE CAPTION (video overlay) ---------- */
.hype-overlay{position:absolute;top:-1vh;left:50%;transform:translate(-50%,-14px);z-index:25;pointer-events:none;opacity:0;background:var(--panel-solid);border:2px solid var(--cyan);border-radius:999px;padding:8px 18px;font-family:var(--font-mono);font-size:12px;font-weight:800;letter-spacing:0.5px;color:var(--text-hi);text-transform:uppercase;white-space:nowrap;box-shadow:0 6px 20px rgba(124,58,237,0.4);}
.hype-overlay.show{animation:hypePop 1.9s ease-out forwards;}
@keyframes hypePop{
  0%{opacity:0;transform:translate(-50%,-14px);}
  12%{opacity:1;transform:translate(-50%,0);}
  85%{opacity:1;transform:translate(-50%,0);}
  100%{opacity:0;transform:translate(-50%,-10px);}
}

/* ---------- COMBO OVERLAY ---------- */
.combo-overlay{position:absolute;top:16%;left:50%;transform:translate(-50%,-50%) scale(0.6);z-index:31;pointer-events:none;opacity:0;display:flex;align-items:center;gap:8px;background:linear-gradient(135deg, rgba(255,200,0,0.30), rgba(88,204,2,0.22));border:2px solid var(--amber);border-radius:14px;padding:9px 18px;box-shadow:0 8px 24px rgba(230,172,0,0.35);}
.combo-overlay .combo-fire{font-size:20px;line-height:1;}
.combo-overlay .combo-text{font-family:var(--font-mono);font-weight:800;font-size:15px;letter-spacing:1px;color:var(--text-hi);white-space:nowrap;}
.combo-overlay.legendary{border-color:var(--cyan);background:linear-gradient(135deg, rgba(124,58,237,0.4), rgba(255,200,0,0.3));box-shadow:0 8px 26px rgba(124,58,237,0.5);}
.combo-overlay.legendary .combo-text{color:#fff;font-size:17px;letter-spacing:2px;}
.combo-overlay.show{animation:comboPop 1.4s cubic-bezier(.22,.9,.25,1.35) forwards;}
@keyframes comboPop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(0.5);}
  20%{opacity:1;transform:translate(-50%,-50%) scale(1.18);}
  35%{transform:translate(-50%,-50%) scale(1);}
  80%{opacity:1;transform:translate(-50%,-50%) scale(1);}
  100%{opacity:0;transform:translate(-50%,-50%) scale(0.92);}
}

/* ---------- RESULTS ---------- */
#results-screen.active{display:flex;flex-direction:column;background:
  radial-gradient(circle at 15% 5%, rgba(255,200,0,0.20), transparent 45%),
  radial-gradient(circle at 90% 95%, rgba(236,72,153,0.25), transparent 45%),
  var(--void);}
.results-wrap{max-width:600px;margin:0 auto;padding:32px 20px 40px;width:100%;overflow-y:auto;}
.score-big{font-family:var(--font-mono);text-align:center;margin:10px 0 4px;}
.score-big .num{font-size:56px;color:var(--amber);font-weight:800;}
.score-big .of{font-size:20px;color:var(--text-mut);}
.score-verdict{text-align:center;color:var(--amber);font-size:14px;margin-bottom:18px;letter-spacing:0.5px;text-transform:uppercase;font-family:var(--font-mono);font-weight:800;}
.rank-card{text-align:center;background:var(--panel);border:1px solid var(--hairline);border-radius:14px;padding:16px 12px;margin-bottom:20px;}
.rank-label{font-family:var(--font-mono);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-mut);font-weight:700;margin-bottom:4px;}
.rank-title{font-size:19px;font-weight:800;color:var(--text-hi);margin-bottom:8px;}
.rank-stars{font-size:22px;letter-spacing:3px;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px;}
.stat-card{background:var(--panel);border:1px solid var(--hairline);border-radius:12px;padding:12px 14px;text-align:center;}
.stat-card .stat-label{font-family:var(--font-mono);font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--text-mut);font-weight:700;margin-bottom:4px;}
.stat-card .stat-value{font-size:22px;font-weight:800;color:var(--text-hi);font-family:var(--font-mono);}
.missed-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--hairline);}
.missed-item img{width:44px;height:32px;object-fit:cover;border-radius:3px;flex:none;background:#3D2E66;}
.missed-item .mi-name{font-weight:700;font-size:14px;color:var(--text-hi);}
.missed-item .mi-said{font-size:12px;color:var(--red);font-family:var(--font-mono);font-weight:700;}
.results-btns{display:flex;gap:10px;margin-top:26px;}
.results-btns button{flex:1;border-radius:12px;padding:14px;font-weight:700;font-size:14px;letter-spacing:0.3px;border:1px solid var(--hairline);background:var(--panel);color:var(--text-hi);}
.results-btns button.primary{background:var(--cyan);color:#fff;border:2px solid #5B21B6;box-shadow:0 4px 0 #5B21B6;}
.no-missed{text-align:center;color:var(--text-mut);font-size:13px;padding:20px 0;}

/* ---------- CLIP SAVE PANEL ---------- */
.clip-panel{position:fixed;inset:0;background:rgba(10,5,26,0.65);display:none;align-items:center;justify-content:center;z-index:60;padding:20px;}
.clip-panel.show{display:flex;}
.clip-inner{background:var(--panel-solid);border:1px solid var(--hairline);border-radius:16px;padding:16px;max-width:380px;width:100%;}
.clip-title{font-family:var(--font-mono);font-size:11px;letter-spacing:1px;color:var(--amber);text-transform:uppercase;margin:0 0 10px;font-weight:800;}
#clip-video{width:100%;max-height:52vh;border-radius:10px;background:#1a0533;display:block;}
.clip-actions{display:flex;gap:8px;margin-top:14px;}
.clip-actions button{flex:1;padding:12px;border-radius:10px;font-weight:700;font-size:13px;letter-spacing:0.3px;border:1px solid var(--hairline);background:rgba(124,58,237,0.15);color:var(--text-hi);}
.clip-actions #clip-download{background:var(--cyan);color:#fff;border:2px solid #5B21B6;}
</style>
</head>
<body>

<!-- ============ SETUP SCREEN ============ -->
<div id="setup-screen" class="screen active">
  <div class="setup-wrap">
    <div class="brand"><span class="brand-mark">📸</span><h1>Flag Cam</h1></div>
    <div class="tagline">🧭 Pack your passport · a flag adventure!</div>

    <div class="step-indicator" id="step-indicator">
      <div class="step-dot active" data-step="1"><span>1</span><em>Flags</em></div>
      <div class="step-line" data-line="1"></div>
      <div class="step-dot" data-step="2"><span>2</span><em>Rounds</em></div>
      <div class="step-line" data-line="2"></div>
      <div class="step-dot" data-step="3"><span>3</span><em>Camera</em></div>
    </div>

    <div class="setup-step active" id="setup-step-1">
      <div class="section-label">🗺️ Choose Your Regions</div>
      <div class="chip-row" id="continent-chips"></div>
      <div class="pool-count"><b id="pool-count">0</b> destinations on your route</div>

      <button class="adv-toggle" id="adv-toggle-btn">✏️ Customize my itinerary <span id="adv-caret">▾</span></button>
      <div class="adv-panel" id="adv-panel">
        <div class="adv-panel-head">
          <span class="adv-panel-title">Pick specific countries</span>
          <button class="adv-close" id="adv-close-btn" aria-label="Close">✕</button>
        </div>
        <div class="adv-actions">
          <button class="adv-action-btn" id="uncheck-all-btn">Uncheck all</button>
        </div>
        <input class="adv-search" id="country-search" placeholder="Search country…">
        <div class="country-list" id="country-list"></div>
      </div>
    </div>

    <div class="setup-step" id="setup-step-2">
      <div class="section-label">🧳 Trip Length</div>
      <div class="round-row" id="round-btns"></div>
      <div class="custom-count-wrap" id="custom-count-wrap">
        <input type="number" id="custom-count-input" min="3" max="195" placeholder="Number of questions">
      </div>
      <div class="setup-note" id="setup-note"></div>
    </div>

    <div class="setup-step" id="setup-step-3">
      <div class="section-label">📸 Get Ready!</div>
      <div class="camera-preview-slot" id="camera-preview-slot">
        <div class="camera-panel" id="camera-panel">
          <video id="cam-video" autoplay playsinline muted></video>
          <div id="no-cam-bg"></div>
          <div class="scanlines"></div>
          <div class="vignette"></div>
          <div class="cam-flag-wrap" id="cam-flag-wrap">
            <div class="reticle" id="reticle">
              <div class="reticle-corner tl"></div>
              <div class="reticle-corner tr"></div>
              <div class="reticle-corner bl"></div>
              <div class="reticle-corner br"></div>
              <div class="flag-frame">
                <div class="sweep" id="sweep"></div>
                <img id="flag-img" src="" alt="flag">
              </div>
            </div>
          </div>
          <div class="cam-answers" id="cam-answers">
            <div class="drop-zone" id="drop-zone"><span class="drop-zone-label" id="drop-zone-label">🏷️ STAMP YOUR GUESS</span></div>
            <div class="hint-text" id="hint-text">Tap a sticker!</div>
            <div class="answers-grid" id="answers-grid"></div>
          </div>
          <div class="countdown-overlay" id="countdown-overlay"><span class="countdown-num" id="countdown-num">3</span></div>
          <div class="face-guide" id="face-guide">
            <div class="face-guide-ring" id="face-guide-ring"></div>
            <div class="face-guide-msg" id="face-guide-msg">🙂 Center your face</div>
          </div>
        </div>
      </div>
      <div class="preview-hint">Center your face in the circle so the camera can see you smile! 😄</div>
    </div>
  </div>

  <div class="start-btn wizard-bar">
    <button class="wizard-back" id="wizard-back-btn">← Back</button>
    <button id="begin-btn">Next →</button>
  </div>
</div>

<!-- ============ GAME SCREEN ============ -->
<div id="game-screen" class="screen">
  <button class="exit-btn" id="exit-btn" style="display:flex;align-items:center;justify-content:center;">✕</button>

  <div class="pause-overlay" id="pause-overlay">
    <div class="pause-card">
      <div class="pause-title">⏸ PAUSED</div>
      <button class="pause-resume-btn" id="pause-resume-btn">▶ Resume</button>
    </div>
  </div>

  <div class="game-layout">
    <div class="hud-top">
      <div class="top-spacer"></div>
      <div class="hud-pill score"><span class="lbl">🛂 STAMPS</span><span id="hud-score">0</span></div>
      <div class="hud-right">
        <button class="hud-pill" id="pause-btn" title="Pause">⏸</button>
        <button class="hud-pill rec-pill" id="rec-btn" title="Record"><span class="rec-dot" id="rec-dot"></span><span id="rec-label">REC</span></button>
      </div>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>

    <div class="flag-panel">
      <div class="scan-caption" id="scan-caption">🧭 Finding next stop…</div>
      <div class="q-title" id="q-title">Whose flag is this?</div>
    </div>

    <div class="content-row">
      <div class="camera-slot" id="camera-slot"></div>
    </div>
  </div>

  <div class="hype-overlay" id="hype-overlay"></div>
  <div class="combo-overlay" id="combo-overlay">
    <span class="combo-fire" id="combo-fire">🔥</span>
    <span class="combo-text" id="combo-text">COMBO</span>
  </div>
  <div class="reaction-overlay" id="reaction-overlay">
    <div class="reaction-card">
      <div class="reaction-icon" id="reaction-icon">✔</div>
      <div class="reaction-text" id="reaction-text">Correct!</div>
      <div class="reaction-sub" id="reaction-sub"></div>
    </div>
    <div class="reaction-plus" id="reaction-plus">+1</div>
  </div>
</div>

<!-- ============ RESULTS SCREEN ============ -->
<div id="results-screen" class="screen">
  <div class="results-wrap">
    <div class="tagline" style="text-align:center;">🌍 World Trip Complete!</div>
    <div class="score-big"><span class="num" id="final-score">0</span><span class="of" id="final-of">/0</span></div>
    <div class="score-verdict" id="score-verdict"></div>
    <div class="rank-card">
      <div class="rank-label">🏆 Explorer Rank</div>
      <div class="rank-title" id="rank-title">—</div>
      <div class="rank-stars" id="rank-stars"></div>
    </div>

/* ---------------- QUESTION BUILDING ---------------- */
let lastSessionCodes = new Set();
function buildQuestions(pool, n, avoidCodes){
  avoidCodes = avoidCodes || new Set();
  let candidates = pool.filter(f=>!avoidCodes.has(f.code));
  if(candidates.length < n){
    // Not enough fresh flags to avoid every repeat — fill the rest from
    // the previously-used ones so we still hit the requested round count.
    const repeats = shuffle(pool.filter(f=>avoidCodes.has(f.code)));
    candidates = candidates.concat(repeats);
  }
  const chosen = shuffle(candidates).slice(0, n);
  let prevCorrectIndex = -1;
  return chosen.map(correct=>{
    const sameContinent = FLAGS.filter(f=>f.continent===correct.continent && f.code!==correct.code);
    let distractors = shuffle(sameContinent).slice(0,3);
    if(distractors.length < 3){
      const others = shuffle(FLAGS.filter(f=>f.code!==correct.code && !distractors.includes(f))).slice(0, 3-distractors.length);
      distractors = distractors.concat(others);
    }
    let options = shuffle([correct, ...distractors]);
    let correctIndex = options.indexOf(correct);
    // A plain shuffle lands the correct answer in the same slot as the
    // previous question about 1 time in 4, which reads as a pattern to
    // play out ("it's always B") rather than as luck. Re-shuffle just the
    // positions (not the option set) until it differs from last time.
    let guard = 0;
    while(correctIndex === prevCorrectIndex && guard < 10){
      options = shuffle(options);
      correctIndex = options.indexOf(correct);
      guard++;
    }
    prevCorrectIndex = correctIndex;
    return { correct, options, correctIndex };
  });
}

async function initCamera(){
  const video = $('cam-video');
  const fallback = $('no-cam-bg');
  // Try camera + mic together first so recordings capture the player's
  // voice. If that's refused (mic blocked, etc.) fall back to video-only
  // rather than losing the camera entirely.
  try{
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: true });
    video.srcObject = stream;
    video.classList.add('mirror');
    fallback.style.display = 'none';
    video.style.display = '';
    return;
  }catch(e0){ /* fall through */ }
  try{
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
    video.srcObject = stream;
    video.classList.add('mirror');
    fallback.style.display = 'none';
    video.style.display = '';
  }catch(e1){
    try{
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: true });
      video.srcObject = stream;
      video.classList.remove('mirror');
      fallback.style.display = 'none';
      video.style.display = '';
    }catch(e2){
      try{
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
        video.srcObject = stream;
        video.classList.remove('mirror');
        fallback.style.display = 'none';
        video.style.display = '';
      }catch(e3){
        video.style.display = 'none';
        fallback.style.display = 'block';
      }
    }
  }
}
function stopCamera(){

/* ---------------- FACE FRAMING GUIDE ---------------- */
// Two detection backends are supported so the framing guide works on every
// browser, not just the ones that ship the (Chrome/Android-only, semi
// deprecated) Shape Detection API:
//   1. Native `FaceDetector` — zero download, fastest, used when present.
//   2. face-api.js (TinyFaceDetector, TFJS-backed WASM/WebGL) — loaded from
//      a CDN and used everywhere else (Safari, Firefox, desktop Chrome).
// If neither is available (offline first load, CDN blocked, etc.) we fall
// back to the original static "center your face" message so the guide
// never breaks the camera step.
let faceDetectorInstance = undefined; // undefined = not checked yet, false = unsupported
let faceGuideActive = false;
let faceApiModelsPromise = null;
const FACEAPI_MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/model/';

function getFaceDetector(){
  if(faceDetectorInstance !== undefined) return faceDetectorInstance;
  try{
    faceDetectorInstance = ('FaceDetector' in window) ? new FaceDetector({ fastMode:true, maxDetectedFaces:1 }) : false;
  }catch(e){ faceDetectorInstance = false; }
  return faceDetectorInstance;
}

// Lazily downloads + initializes the face-api.js tiny detector model once,
// caching the in-flight/resolved promise so repeated calls (re-entering the
// camera step) don't re-download anything.
function loadFaceApiModels(){
  if(faceApiModelsPromise) return faceApiModelsPromise;
  faceApiModelsPromise = (async ()=>{
    if(typeof faceapi === 'undefined') return false;
    try{
      await faceapi.nets.tinyFaceDetector.loadFromUri(FACEAPI_MODEL_URL);
      return true;
    }catch(e){
      return false;
    }
  })();
  return faceApiModelsPromise;
}

async function startFaceGuide(){
  $('face-guide').classList.add('show');
  $('face-guide-ring').classList.remove('good');
  faceGuideActive = true;

  const nativeDetector = getFaceDetector();
  const video = $('cam-video');
  const tmp = document.createElement('canvas');
  const tctx = tmp.getContext('2d');

  const detectNative = async (canvas)=> await nativeDetector.detect(canvas);
  const detectFaceApi = async (canvas)=>{
    const opts = new faceapi.TinyFaceDetectorOptions({ inputSize: 160, scoreThreshold: 0.5 });
    const result = await faceapi.detectSingleFace(canvas, opts);
    return result ? [{ boundingBox: result.box }] : [];
  };

  let detectFn = null;
  if(nativeDetector){
    detectFn = detectNative;
  } else {
    $('face-guide-msg').textContent = '🙂 Loading face guide…';
    const ready = await loadFaceApiModels();
    if(!faceGuideActive) return; // user backed out while models were loading
    if(ready){
      detectFn = detectFaceApi;
    } else {
      // No on-device face detection available — still give friendly, honest guidance.
      $('face-guide-msg').textContent = '🙂 Center your face in the circle';
      return;
    }
  }

  $('face-guide-msg').textContent = '🙂 Move closer';

  const loop = async ()=>{
    if(!faceGuideActive) return;
    if(video.videoWidth){
      tmp.width = 180;
      tmp.height = Math.round(180 * video.videoHeight / video.videoWidth);
      try{
        tctx.drawImage(video, 0, 0, tmp.width, tmp.height);
        const faces = await detectFn(tmp);
        applyFaceGuideResult(faces, tmp.width, tmp.height);
      }catch(e){ /* skip this tick */ }
    }
    if(faceGuideActive) setTimeout(loop, 450);
  };
  loop();
}

function applyFaceGuideResult(faces, cw, ch){
  const msg = $('face-guide-msg'), ring = $('face-guide-ring');
  if(!faces || faces.length === 0){
    msg.textContent = '🙂 Show your face';
    ring.classList.remove('good');
    return;
  }
  const box = faces[0].boundingBox;
  const areaRatio = (box.width * box.height) / (cw * ch);
  const cx = box.x + box.width/2, cy = box.y + box.height/2;
  const centered = Math.abs(cx - cw/2) < cw*0.2 && Math.abs(cy - ch/2) < ch*0.25;

  if(areaRatio < 0.09){
    msg.textContent = '🙂 Move closer';
    ring.classList.remove('good');
  } else if(areaRatio > 0.34){
    msg.textContent = '🤏 Move back a bit';
    ring.classList.remove('good');
  } else if(!centered){
    msg.textContent = '↔️ Center your face';
    ring.classList.remove('good');
  } else {
    msg.textContent = '👍 Perfect!';
    ring.classList.add('good');
  }
}

function stopFaceGuide(){
  faceGuideActive = false;
  $('face-guide').classList.remove('show');
}

/* ---------------- VOICE (removed) ---------------- */

/* ---------------- REACTIONS ---------------- */
function showReaction(correct, correctName){
  const ov = $('reaction-overlay');
  const plus = $('reaction-plus');
  ov.classList.remove('show','correct','wrong');
  plus.classList.remove('show');
  void ov.offsetWidth;
  $('reaction-icon').textContent = correct ? '✔' : '✘';
  $('reaction-text').textContent = correct ? ('🎉 ' + correctName + ' is Correct!') : 'Not quite!';
  $('reaction-sub').innerHTML = correct ? '' : `It was:<br><b>${correctName}</b>`;
  ov.classList.add('show', correct ? 'correct' : 'wrong');
  if(correct){
    void plus.offsetWidth;
    plus.classList.add('show');
  }
}
function clearReaction(){
  const ov = $('reaction-overlay');
  ov.classList.remove('show','correct','wrong');
  $('reaction-plus').classList.remove('show');
}

/* ---------------- GAME FLOW ---------------- */
function startGame(){
  const pool = FLAGS.filter(f=>selectedCodes.has(f.code));
  const wanted = customCount !== null ? customCount : selectedRounds;
  const n = Math.max(1, Math.min(wanted, pool.length));
  quiz.questions = buildQuestions(pool, n, lastSessionCodes);
  lastSessionCodes = new Set(quiz.questions.map(q=>q.correct.code));
  quiz.index = 0;
  quiz.score = 0;
  quiz.missed = [];
  quiz.streak = 0;
  quiz.maxStreak = 0;
  quiz.answerTimes = [];
  quiz.paused = false;
  $('game-screen').classList.remove('paused');
  $('pause-overlay').style.display = 'none';
  $('pause-btn').textContent = '⏸';
  hypeState = { text: '', until: 0 };
  clearComboOverlay();
  gameActive = true;
  stopFaceGuide();
  $('camera-slot').appendChild($('camera-panel'));
  $('camera-panel').classList.add('in-game');
  switchScreen('game');
  if(!stream) initCamera();
  showQuestion();
}

function showQuestion(){
  answered = false;
  lastAnsweredIdx = null;
  clearReaction();
  clearComboOverlay();
  const q = quiz.questions[quiz.index];
  lastFlagShown = { code: q.correct.code, name: q.correct.name };

  // Reset everything to a blank state while the countdown plays, so the
  // question appears all at once right on "GO!" — and the child has a
  // clean moment to look at the camera.
  const img = $('flag-img');
  img.classList.remove('show');
  $('reticle').classList.remove('locked');
  $('scan-caption').textContent = '';
  $('sweep').style.display = 'none';
  $('answers-grid').innerHTML = '';
  const dz = $('drop-zone');
  dz.classList.remove('over','correct','wrong');
  dz.innerHTML = '<span class="drop-zone-label" id="drop-zone-label">🏷️ STAMP YOUR GUESS</span>';
  $('hud-score').textContent = quiz.score;
  $('progress-fill').style.width = ((quiz.index)/quiz.questions.length*100) + '%';

  runCountdown(()=>{
    if(quiz.index === 0 && recordingSupported && !recState.active) startRecording();
    beginQuestionReveal(q);
  });
}

function beginQuestionReveal(q){
  if(quiz.index === 0 || Math.random() < 0.35) triggerHype();
  const img = $('flag-img');
  img.crossOrigin = 'anonymous';
  $('scan-caption').textContent = '🧭 Finding next stop…';
  $('sweep').style.display = '';

  let imgReady = false, voiceDone = false;
  function tryReveal(){
    if(!imgReady || !voiceDone) return;
    img.classList.add('show');
    $('reticle').classList.add('locked');
    $('scan-caption').textContent = '✈️ Next Destination!';
    $('sweep').style.display = 'none';
    questionRevealTs = Date.now();
  }
  img.onload = ()=>{ imgReady = true; tryReveal(); };
  img.src = flagUrl(q.correct.code);
  img.onerror = ()=>{ img.src = ''; imgReady = true; tryReveal(); };
  runVoiceIntro(()=>{ voiceDone = true; tryReveal(); });

  const grid = $('answers-grid');
  grid.innerHTML = '';
  const letters = ['A','B','C','D'];
  q.options.forEach((opt, i)=>{
    const btn = document.createElement('button');
    btn.className = 'answer-tile';
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span class="aname">${opt.name}</span>`;
    attachDragHandlers(btn, i);
    grid.appendChild(btn);
  });
}

/* ---------------- COUNTDOWN ---------------- */
let countdownState = { active:false, value:'' };
function runCountdown(callback){
  const first = quiz.index === 0;
  const steps = first ? ['3','2','1','GO!'] : ['2','1'];
  const el = $('countdown-overlay');
  const numEl = $('countdown-num');
  el.classList.add('show');
  countdownState.active = true;
  let i = 0;
  function tick(){
    if(i >= steps.length){
      countdownState.active = false;
      countdownState.value = '';
      el.classList.remove('show');
      if(gameActive) callback();
      return;
    }
    const val = steps[i];
    countdownState.value = val;
    numEl.textContent = val;
    numEl.classList.toggle('go', val === 'GO!');
    numEl.classList.remove('pulse');
    void numEl.offsetWidth; // restart animation
    numEl.classList.add('pulse');
    i++;
    setTimeout(tick, val === 'GO!' ? 500 : 700);
  }
  tick();
}

/* ---------------- ANSWER SELECTION (tap) ---------------- */
function attachDragHandlers(tile, idx){
  tile.addEventListener('pointerup', (e)=>{
    if(answered) return;
    e.preventDefault();
    tile.classList.add('tapped');
    handleAnswer(idx);
  });
}

let questionRevealTs = 0;
function handleAnswer(idx){
  if(answered || quiz.paused) return;
  const q = quiz.questions[quiz.index];
  if(idx<0 || idx>=q.options.length) return;
  answered = true;
  lastAnsweredIdx = idx;
  cancelSpeech();
  if(questionRevealTs) quiz.answerTimes.push((Date.now()-questionRevealTs)/1000);
  const tiles = document.querySelectorAll('.answer-tile');
  const correct = idx === q.correctIndex;
  const letters = ['A','B','C','D'];

  const dz = $('drop-zone');
  dz.innerHTML = `<span class="letter">${letters[idx]}</span><span class="aname">${q.options[idx].name}</span>`;
  dz.classList.add(correct ? 'correct' : 'wrong');

  tiles[idx].classList.add('placeholder');
  if(correct){
    quiz.score++;
    quiz.streak++;
    if(quiz.streak > quiz.maxStreak) quiz.maxStreak = quiz.streak;
    if(quiz.streak >= 2) triggerCombo(quiz.streak);
  }else{
    quiz.streak = 0;
    clearComboOverlay();
    tiles[q.correctIndex].classList.add('correct');
    quiz.missed.push({ code: q.correct.code, name: q.correct.name, said: q.options[idx].name });
  }
  $('hud-score').textContent = quiz.score;
  showReaction(correct, q.correct.name);
  setTimeout(next, 1300);
}

function next(){
  quiz.index++;
  if(quiz.index >= quiz.questions.length){
    endGame();
  }else{
    showQuestion();
  }
}

/* ---------------- PAUSE ---------------- */
function pauseGame(){
  if(!gameActive || quiz.paused) return;
  quiz.paused = true;
  cancelSpeech();
  const video = $('cam-video');
  if(video && !video.paused) video.pause();
  pauseRecordingForGamePause();
  $('game-screen').classList.add('paused');
  $('pause-overlay').style.display = 'flex';
  $('pause-btn').textContent = '▶';
}
function resumeGame(){
  if(!gameActive || !quiz.paused) return;
  quiz.paused = false;
  const video = $('cam-video');
  if(video) video.play().catch(()=>{});
  resumeRecordingForGameResume();
  $('game-screen').classList.remove('paused');
  $('pause-overlay').style.display = 'none';
  $('pause-btn').textContent = '⏸';
}
// Auto-pause if the tab/app is backgrounded mid-game (screen lock, app
// switch, incoming call). Without this the recorder keeps running while
// the canvas draw loop stalls in the background, producing a clip that
// looks frozen but keeps advancing in time. Requires the user to tap
// Resume rather than resuming automatically, since the camera feed may
// need re-acquiring after a long backgrounding anyway.
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden && gameActive && !quiz.paused) pauseGame();
});

function endGame(){
  gameActive = false;
  cancelSpeech();
  if(recState.active) stopRecording();
  stopCamera();
  $('progress-fill').style.width = '100%';
  $('final-score').textContent = quiz.score;
  $('final-of').textContent = '/' + quiz.questions.length;
  const pct = quiz.score / quiz.questions.length;
  const verdict = pct===1 ? '🏆 MASTER EXPLORER' : pct>=0.8 ? '🧭 SEASONED TRAVELER' : pct>=0.5 ? '🎒 RISING EXPLORER' : '🗺️ EXPLORER IN TRAINING';
  $('score-verdict').textContent = verdict;

  const rankTitle = EXPLORER_RANKS[Math.floor(Math.random()*EXPLORER_RANKS.length)];
  $('rank-title').textContent = rankTitle;
  const starCount = Math.max(1, Math.round(pct*5));
  $('rank-stars').textContent = '⭐'.repeat(starCount) + '☆'.repeat(5-starCount);

  $('stat-combo').textContent = quiz.maxStreak;
  $('stat-fastest').textContent = quiz.answerTimes.length ? Math.min(...quiz.answerTimes).toFixed(1)+' sec' : '–';
  $('stat-visited').textContent = quiz.questions.length;
  $('stat-accuracy').textContent = Math.round(pct*100)+'%';

  const list = $('missed-list');
  list.innerHTML = '';
  if(quiz.missed.length===0){
    list.innerHTML = '<div class="no-missed">No misses. Clean sweep.</div>';
  }else{
    quiz.missed.forEach(m=>{
      const row = document.createElement('div');
      row.className = 'missed-item';
      row.innerHTML = `<img src="${flagUrl(m.code)}" alt="">
        <div><div class="mi-name">${m.name}</div><div class="mi-said">You said: ${m.said}</div></div>`;
      list.appendChild(row);
    });
  }
  switchScreen('results');
}

/* ---------------- RECORDING ---------------- */
function pickMimeType(){
  const candidates = [
    'video/webm;codecs=vp9,opus',
    'video/webm;codecs=vp8,opus',
    'video/webm',
    'video/mp4'
  ];
  for(const c of candidates){
    if(MediaRecorder.isTypeSupported(c)) return c;
  }
  return '';
}

function roundRectPath(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function drawRecFrame(now){
  if(!recState.active) return;
  // The canvas is captured at 30fps regardless of how often we draw to it,
  // so redrawing at the default ~60Hz animation-frame rate is wasted work
  // that competes with drag input for main-thread time. Skip every other
  // frame to roughly halve that cost.
  if(recState.lastDrawTs && now - recState.lastDrawTs < 30){
    recState.rafId = requestAnimationFrame(drawRecFrame);
    return;
  }
  recState.lastDrawTs = now;
  const ctx = recState.ctx, canvas = recState.canvas;
  const w = canvas.width, h = canvas.height;
  const video = $('cam-video');

  ctx.save();
  if(video.style.display !== 'none' && video.videoWidth){
    if(video.classList.contains('mirror')){
      ctx.translate(w,0); ctx.scale(-1,1);
    }
    try{ ctx.drawImage(video,0,0,w,h); }catch(e){}
  } else {
    ctx.fillStyle = '#1a0533';
    ctx.fillRect(0,0,w,h);
  }
  ctx.restore();

  // HUD bar
  ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(0,0,w,h*0.09);
  ctx.font = `bold ${Math.round(h*0.024)}px sans-serif`;
  ctx.fillStyle = '#FFC800';
  ctx.textAlign = 'left';
  ctx.fillText('🛂 STAMPS ' + quiz.score, w*0.04, h*0.045);
  if(gameActive && quiz.questions.length){
    ctx.textAlign = 'right';
    ctx.fillStyle = '#F5F1FF';
    ctx.fillText((quiz.index+1) + '/' + quiz.questions.length, w*0.96, h*0.045);
    ctx.textAlign = 'left';
    const prog = quiz.index / quiz.questions.length;
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fillRect(w*0.04, h*0.078, w*0.92, 3);
    ctx.fillStyle = '#FFC800';
    ctx.fillRect(w*0.04, h*0.078, w*0.92*prog, 3);
  }

  const q = (gameActive && !countdownState.active) ? quiz.questions[quiz.index] : null;
  if(q){
    const rw = w*0.465, rh = rw*0.75, rx = (w-rw)/2, ry = h*0.13;
    const cl = Math.round(w*0.035);
    ctx.strokeStyle = '#FFC800';
    ctx.lineWidth = Math.max(2, w*0.004);
    ctx.beginPath();
    ctx.moveTo(rx, ry+cl); ctx.lineTo(rx, ry); ctx.lineTo(rx+cl, ry);
    ctx.moveTo(rx+rw-cl, ry); ctx.lineTo(rx+rw, ry); ctx.lineTo(rx+rw, ry+cl);
    ctx.moveTo(rx, ry+rh-cl); ctx.lineTo(rx, ry+rh); ctx.lineTo(rx+cl, ry+rh);
    ctx.moveTo(rx+rw-cl, ry+rh); ctx.lineTo(rx+rw, ry+rh); ctx.lineTo(rx+rw, ry+rh-cl);
    ctx.stroke();

    const flagImgEl = $('flag-img');
    if(flagImgEl.complete && flagImgEl.naturalWidth>0){
      try{ ctx.drawImage(flagImgEl, rx, ry, rw, rh); }
      catch(e){ ctx.fillStyle = '#3D2E66'; ctx.fillRect(rx,ry,rw,rh); }
    } else {
      ctx.fillStyle = '#3D2E66';
      ctx.fillRect(rx,ry,rw,rh);
    }

    ctx.textAlign = 'center';
    ctx.font = `${Math.round(h*0.02)}px sans-serif`;
    ctx.fillStyle = '#C9A6FF';
    ctx.fillText('WHOSE FLAG IS THIS?', w/2, ry+rh+h*0.035);
    ctx.textAlign = 'left';

    // Choices are anchored to the bottom of the frame (not to the flag box)
    // so they sit in the open space below the person's face/chin instead of
    // crowding right under the flag.
    const letters = ['A','B','C','D'];
    const colW = w*0.44, colGap = w*0.02, rowH = h*0.075, rowGap = h*0.02;
    const blockH = rowH*2 + rowGap;
    const bottomMargin = h*0.1;
    const ay0 = h - bottomMargin - blockH;
    q.options.forEach((opt,i)=>{
      const col = i%2, row = Math.floor(i/2);
      const ax = w*0.04 + col*(colW+colGap);
      const ay = ay0 + row*(rowH+rowGap);
      let bg = 'rgba(35,20,74,0.85)', bd = '#E6AC00', tc = '#F5F1FF';
      if(lastAnsweredIdx!==null){
        if(i===q.correctIndex){ bg='rgba(88,204,2,0.35)'; bd='#58CC02'; }
        else if(i===lastAnsweredIdx){ bg='rgba(255,75,75,0.35)'; bd='#FF4B4B'; }
      }
      ctx.fillStyle = bg; ctx.fillRect(ax,ay,colW,rowH);
      ctx.strokeStyle = bd; ctx.lineWidth = 2; ctx.strokeRect(ax,ay,colW,rowH);
      ctx.fillStyle = bd;
      ctx.font = `bold ${Math.round(h*0.02)}px sans-serif`;
      ctx.fillText(letters[i], ax+10, ay+rowH/2);
      ctx.fillStyle = tc;
      ctx.font = `${Math.round(h*0.018)}px sans-serif`;
      ctx.fillText(opt.name, ax+32, ay+rowH/2);
    });
  }

  // hype caption baked into the saved clip
  const nowMs = Date.now();
  if(hypeState.until > nowMs){
    const text = hypeState.text.toUpperCase();
    ctx.font = `bold ${Math.round(h*0.022)}px sans-serif`;
    const padX = w*0.035, textW = ctx.measureText(text).width;
    const boxW = textW + padX*2, boxH = h*0.05, bx = (w-boxW)/2, by = h*0.03;
    ctx.fillStyle = '#231447';
    ctx.strokeStyle = '#7C3AED';
    ctx.lineWidth = 2;
    roundRectPath(ctx, bx, by, boxW, boxH, boxH/2);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#F5F1FF';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, w/2, by+boxH/2);
    ctx.textAlign = 'left';
  }

  // combo badge baked into the saved clip
  if(comboState.until > nowMs){
    const legendary = comboState.legendary;
    const fireTxt = comboState.fire, comboTxt = comboState.text;
    ctx.font = `${Math.round(h*(legendary?0.036:0.03))}px sans-serif`;
    const fireW = ctx.measureText(fireTxt).width;
    ctx.font = `bold ${Math.round(h*(legendary?0.026:0.022))}px sans-serif`;
    const textW2 = ctx.measureText(comboTxt).width;
    const gap = w*0.015;
    const boxW2 = fireW+textW2+gap*3, boxH2 = h*0.06, bx2 = (w-boxW2)/2, by2 = h*0.16;
    ctx.fillStyle = legendary ? 'rgba(124,58,237,0.45)' : 'rgba(255,200,0,0.35)';
    ctx.strokeStyle = legendary ? '#7C3AED' : '#E6AC00';
    ctx.lineWidth = 2;
    roundRectPath(ctx, bx2, by2, boxW2, boxH2, boxH2/2);
    ctx.fill(); ctx.stroke();
    ctx.textBaseline = 'middle';
    ctx.font = `${Math.round(h*(legendary?0.036:0.03))}px sans-serif`;
    ctx.textAlign = 'left';
    ctx.fillText(fireTxt, bx2+gap, by2+boxH2/2);
    ctx.font = `bold ${Math.round(h*(legendary?0.026:0.022))}px sans-serif`;
    ctx.fillStyle = '#F5F1FF';
    ctx.fillText(comboTxt, bx2+gap*2+fireW, by2+boxH2/2);
  }

  // countdown baked into the saved clip
  if(countdownState.active && countdownState.value){
    ctx.fillStyle = 'rgba(10,5,26,0.40)';
    ctx.fillRect(0,0,w,h);
    const txt = countdownState.value;
    ctx.font = `bold ${Math.round(h*0.16)}px sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.lineWidth = Math.max(4, w*0.01);
    ctx.strokeText(txt, w/2, h/2);
    ctx.fillStyle = txt === 'GO!' ? '#58CC02' : '#FFC800';
    ctx.fillText(txt, w/2, h/2);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  }

  // rec indicator baked into the saved clip
  const elapsed = Math.floor((Date.now()-recState.startTs)/1000);
  const mm = String(Math.floor(elapsed/60)).padStart(2,'0');
  const ss = String(elapsed%60).padStart(2,'0');
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(w-92, h-32, 82, 24);
  ctx.fillStyle = '#FF4B4B';
  ctx.beginPath(); ctx.arc(w-78, h-20, 5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = '12px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(mm+':'+ss, w-68, h-20+4);

  recState.rafId = requestAnimationFrame(drawRecFrame);
}

// Composes a celebratory freeze-frame on top of whatever is currently on the
// recording canvas (the last live camera frame). Held for ~1.5s before the
// recorder actually stops, so the saved clip ends on a nice frame instead of
// a random mid-motion one — and it doubles as the in-app preview poster.
function drawRecapFrame(ctx, canvas){
  const w = canvas.width, h = canvas.height;

  // top banner
  ctx.font = `bold ${Math.round(h*0.026)}px sans-serif`;
  const bannerText = '🌍 World Trip Complete!';
  const padX = w*0.04, textW = ctx.measureText(bannerText).width;
  const boxW = textW + padX*2, boxH = h*0.055, bx = (w-boxW)/2, by = h*0.035;
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.strokeStyle = '#7C3AED';
  ctx.lineWidth = 2;
  roundRectPath(ctx, bx, by, boxW, boxH, boxH/2);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#2D2640';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(bannerText, w/2, by+boxH/2);

  // bottom recap card
  const bandH = h*0.22, by2 = h - bandH;
  ctx.fillStyle = 'rgba(255,255,255,0.94)';
  roundRectPath(ctx, 0, by2, w, bandH + 20, 22);
  ctx.fill();

  const colW = w/3, midY = by2 + bandH/2;

  // col 1 — the kid
  ctx.font = `${Math.round(bandH*0.42)}px sans-serif`;
  ctx.fillStyle = '#2D2640';
  ctx.textAlign = 'center';
  ctx.fillText('😀', colW*0.5, midY - bandH*0.12);
  ctx.font = `bold ${Math.round(bandH*0.15)}px sans-serif`;
  ctx.fillText('Great job!', colW*0.5, midY + bandH*0.28);

  // col 2 — last flag
  const flagImgEl = $('flag-img');
  const fw = colW*0.42, fh = fw*0.66, fx = colW*1.5 - fw/2, fy = midY - fh*0.7;
  try{
    if(flagImgEl && flagImgEl.complete && flagImgEl.naturalWidth>0){
      ctx.drawImage(flagImgEl, fx, fy, fw, fh);
    } else {
      ctx.fillStyle = '#E0D4FF'; ctx.fillRect(fx, fy, fw, fh);
    }
  }catch(e){ ctx.fillStyle = '#E0D4FF'; ctx.fillRect(fx, fy, fw, fh); }
  ctx.strokeStyle = '#E6AC00'; ctx.lineWidth = 2; ctx.strokeRect(fx, fy, fw, fh);
  ctx.font = `bold ${Math.round(bandH*0.13)}px sans-serif`;
  ctx.fillStyle = '#2D2640';
  const flagLabel = '🏁 ' + (lastFlagShown ? lastFlagShown.name : 'Last flag');
  ctx.fillText(flagLabel, colW*1.5, fy+fh+bandH*0.16);

  // col 3 — final score
  ctx.font = `${Math.round(bandH*0.4)}px sans-serif`;
  ctx.fillStyle = '#2D2640';
  ctx.fillText('🏆', colW*2.5, midY - bandH*0.12);
  ctx.font = `bold ${Math.round(bandH*0.18)}px sans-serif`;
  ctx.fillStyle = '#E6AC00';
  ctx.fillText(quiz.score + ' / ' + quiz.questions.length, colW*2.5, midY + bandH*0.28);

  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
}

async function startRecording(){
  if(!recordingSupported || recState.active) return;
  const video = $('cam-video');
  const w = video.videoWidth ? Math.min(video.videoWidth, 960) : 720;
  const h = video.videoWidth ? Math.round(w * (video.videoHeight/video.videoWidth)) : 1280;

  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  const canvasStream = canvas.captureStream(30);
  const micTracks = (stream && stream.getAudioTracks) ? stream.getAudioTracks() : [];
  const combined = new MediaStream([...canvasStream.getVideoTracks(), ...micTracks]);

  const mimeType = pickMimeType();
  let recorder;
  // Capping the bitrate keeps memory growth in check on long sessions, and
  // recorder.start(1000) below makes MediaRecorder flush its internal
  // buffer once a second instead of holding the entire recording in memory
  // until stop() is called — on longer games that unbounded buffer is what
  // was crashing the tab ("Aw, Snap!") on Android Chrome.
  const recorderOpts = { videoBitsPerSecond: 1500000 };
  if(mimeType) recorderOpts.mimeType = mimeType;
  try{
    recorder = new MediaRecorder(combined, recorderOpts);
  }catch(e){
    return;
  }

  recState.chunks = [];
  recState.posterDataUrl = null;
  recorder.ondataavailable = (e)=>{ if(e.data && e.data.size) recState.chunks.push(e.data); };
  recorder.onstop = ()=>finalizeRecording(recorder.mimeType || mimeType || 'video/webm');

  recState.recorder = recorder;
  recState.canvas = canvas;
  recState.ctx = ctx;
  recState.canvasStream = canvasStream;
  recState.mimeType = mimeType;
  recState.startTs = Date.now();
  recState.lastDrawTs = 0;
  recState.active = true;

  recState.pausedMs = 0;
  recorder.start(1000);
  drawRecFrame(performance.now());

  $('rec-btn').classList.add('recording');
  $('rec-dot').classList.add('live');
  startRecTimerLabel();
}

function startRecTimerLabel(){
  clearInterval(recState.timerInterval);
  recState.timerInterval = setInterval(()=>{
    const elapsed = Math.floor((Date.now()-recState.startTs-recState.pausedMs)/1000);
    const mm = String(Math.floor(elapsed/60)).padStart(2,'0');
    const ss = String(elapsed%60).padStart(2,'0');
    $('rec-label').textContent = mm+':'+ss;
  }, 500);
}

// Recording is paused/resumed in lockstep with the game (see pauseGame/
// resumeGame). Without this, a backgrounded tab or a paused game keeps
// MediaRecorder chunking at a steady clock while drawRecFrame's rAF loop
// is throttled or stopped — the result is a clip whose duration keeps
// climbing normally but whose picture is frozen on the last drawn frame.
// Pausing the recorder (not just the draw loop) keeps duration and
// picture in sync.
function pauseRecordingForGamePause(){
  if(!recState.active || !recState.recorder || recState.recorder.state!=='recording') return;
  recState.recorder.pause();
  recState.pauseStartedTs = Date.now();
  if(recState.rafId) cancelAnimationFrame(recState.rafId);
  clearInterval(recState.timerInterval);
}
function resumeRecordingForGameResume(){
  if(!recState.active || !recState.recorder || recState.recorder.state!=='paused') return;
  if(recState.pauseStartedTs) recState.pausedMs += Date.now()-recState.pauseStartedTs;
  recState.recorder.resume();
  recState.lastDrawTs = 0;
  drawRecFrame(performance.now());
  startRecTimerLabel();
}

function stopRecording(){
  if(!recState.active) return;
  recState.active = false;
  if(recState.rafId) cancelAnimationFrame(recState.rafId);
  clearInterval(recState.timerInterval);
  $('rec-btn').classList.remove('recording');
  $('rec-dot').classList.remove('live');
  $('rec-label').textContent = 'REC';

  if(recState.ctx && recState.canvas){
    try{ drawRecapFrame(recState.ctx, recState.canvas); }catch(e){}
    try{ recState.posterDataUrl = recState.canvas.toDataURL('image/jpeg', 0.85); }catch(e){}
  }

  // Hold the recap frame on the canvas for a moment so it gets baked into
  // the end of the saved clip, then actually stop the recorder.
  setTimeout(()=>{
    if(recState.recorder && recState.recorder.state !== 'inactive') recState.recorder.stop();
  }, 1500);
}

function finalizeRecording(mimeType){
  const blob = new Blob(recState.chunks, { type: mimeType.split(';')[0] });
  if(recState.canvasStream){ recState.canvasStream.getTracks().forEach(t=>t.stop()); }
  if(blob.size === 0) return;
  const url = URL.createObjectURL(blob);
  const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
  const poolLabel = activePool==='all' ? 'All' : activePool==='unlocked' ? 'Unlocked' : 'Custom';
  const total = quiz.questions.length;
  const dateStr = new Date().toISOString().slice(0,10);
  const perfectTag = (total>0 && quiz.score===total) ? '_Perfect' : '';
  const filename = `FlagQuest_${poolLabel}_${quiz.score}-${total}_${dateStr}${perfectTag}.${ext}`;
  showClipPanel(url, blob, filename);
}

function showClipPanel(url, blob, filename){
  const video = $('clip-video');
  if(recState.posterDataUrl) video.poster = recState.posterDataUrl;
  video.src = url;
  $('clip-panel').classList.add('show');

  $('clip-download').onclick = ()=>{
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
  };

  const shareBtn = $('clip-share');
  let file = null;
  try{ file = new File([blob], filename, { type: blob.type }); }catch(e){}
  if(file && navigator.canShare && navigator.canShare({ files:[file] })){
    shareBtn.style.display = '';
    shareBtn.onclick = async ()=>{
      try{ await navigator.share({ files:[file], title:'Flag Cam recording' }); }catch(e){}
    };
  } else {
    shareBtn.style.display = 'none';
  }

  $('clip-discard').onclick = ()=>{
    $('clip-panel').classList.remove('show');
    video.pause(); video.src = ''; video.removeAttribute('poster');
    URL.revokeObjectURL(url);
  };
}

if(!recordingSupported){
  $('rec-btn').disabled = true;
  $('rec-btn').title = 'Recording not supported in this browser';
}
$('rec-btn').addEventListener('click', ()=>{
  if(!gameActive) return;
  recState.active ? stopRecording() : startRecording();
});

/* ---------------- EVENTS ---------------- */
$('begin-btn').addEventListener('click', ()=>{
  if(wizardStep < 3){
    goToStep(wizardStep + 1);
  } else {
    startGame();
  }
});
$('wizard-back-btn').addEventListener('click', ()=>{
  if(wizardStep > 1) goToStep(wizardStep - 1);
});
$('exit-btn').addEventListener('click', ()=>{
  gameActive = false;
  quiz.paused = false;
  $('game-screen').classList.remove('paused');
  $('pause-overlay').style.display = 'none';
  cancelSpeech();
  if(recState.active) stopRecording();
  stopCamera();
  resetWizard();
  switchScreen('setup');
});
$('retry-btn').addEventListener('click', startGame);
$('new-setup-btn').addEventListener('click', ()=>{ resetWizard(); switchScreen('setup'); });

document.addEventListener('keydown', (e)=>{
  if(!gameActive || quiz.paused) return;
  const k = e.key.toLowerCase();
  const map = {a:0,b:1,c:2,d:3};
  if(k in map) handleAnswer(map[k]);
});
$('pause-btn').addEventListener('click', ()=>{
  if(!gameActive) return;
  quiz.paused ? resumeGame() : pauseGame();
});
$('pause-resume-btn').addEventListener('click', resumeGame);

/* ---------------- INIT ---------------- */
renderPoolChips();
renderCountryList();
renderRoundButtons();
refreshPoolUI();
goToStep(1);
})();
