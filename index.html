<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Flag Atlas 🌍</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800;900&family=Dancing+Script:wght@600;700&family=Space+Grotesk:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/twemoji.min.js" crossorigin="anonymous"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
img.emoji{height:1em;width:1em;margin:0 .05em 0 .1em;vertical-align:-0.1em}
html{-webkit-text-size-adjust:100%}
:root{
  --font-display:'Baloo 2',sans-serif; --font-body:'Nunito','Segoe UI',sans-serif;
  --green:#58CC02; --green-dark:#46A302; --green-bg:#D7FFB8; --green-text:#3C8403;
  --blue:#1CB0F6; --blue-dark:#0A91D6; --blue-bg:#DDF4FF;
  --gold:#FFC800; --gold-dark:#E6AC00; --gold-text:#7A5B00;
  --red:#FF4B4B; --red-dark:#E62E2E; --red-bg:#FFDFE0; --red-text:#C9302C;
  --purple:#CE82FF; --purple-dark:#A557E0;
  --orange:#FF9600; --orange-dark:#E07F00;
  --ink:#2D2640; --ink-soft:#6B5E8A;
  --line:#D8CEF0; --bg:#F4F0FF; --bg-soft:#EDE6FF;
  --card:#FFFFFF;
  --accent1:#7C3AED; --accent1-dark:#5B21B6;
  --accent2:#EC4899; --accent2-dark:#BE185D;
  --night-sky:linear-gradient(160deg,#1a0533 0%,#2d1054 40%,#1a1a4e 100%);
}
body{background:var(--bg-soft);font-family:var(--font-body);color:var(--ink);min-height:100vh;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain;
  background-image:radial-gradient(ellipse at 20% 20%,rgba(124,58,237,0.08) 0%,transparent 60%),
    radial-gradient(ellipse at 80% 80%,rgba(236,72,153,0.08) 0%,transparent 60%),
    radial-gradient(ellipse at 50% 50%,rgba(28,176,246,0.05) 0%,transparent 70%);
}
button{font-family:inherit;cursor:pointer;border:none;background:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:disabled{cursor:default;opacity:0.5}
h1,h2,h3{font-family:var(--font-display)}

/* ── ANIMATIONS ── */
@keyframes pulseGlow{0%,100%{box-shadow:0 4px 0 var(--accent1-dark),0 0 0 0 rgba(124,58,237,0)}50%{box-shadow:0 4px 0 var(--accent1-dark),0 0 0 8px rgba(124,58,237,0.18)}}
@keyframes stampIn{from{opacity:0;transform:scale(0.88) rotate(-2deg)}to{opacity:1;transform:scale(1) rotate(0)}}
@keyframes feedbackIn{from{opacity:0;transform:translateY(100%)}to{opacity:1;transform:translateY(0)}}
@keyframes bounceIn{0%{transform:scale(0.4);opacity:0}60%{transform:scale(1.15)}80%{transform:scale(0.95)}100%{transform:scale(1);opacity:1}}
@keyframes confettiFall{0%{transform:translateY(-10px) rotate(0deg);opacity:1}100%{transform:translateY(420px) rotate(720deg);opacity:0}}
@keyframes ftPulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes wobble{0%,100%{transform:rotate(0deg)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{from{opacity:0;transform:scale(0.7)}to{opacity:1;transform:scale(1)}}
@keyframes floatStars{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}

.stamp-enter{animation:stampIn .35s ease}
.feedback-enter{animation:feedbackIn .28s cubic-bezier(.2,.7,.3,1)}
.bounce-in{animation:bounceIn .5s cubic-bezier(.36,.07,.19,.97)}
.slide-up{animation:slideUp .4s ease}
.pop-in{animation:popIn .3s cubic-bezier(.34,1.56,.64,1)}
.current-pulse{animation:pulseGlow 2.2s ease-in-out infinite}

/* ── LAYOUT ── */
#app{width:100%;min-height:100vh;display:flex;flex-direction:column}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-display);font-weight:700;font-size:clamp(14px,3.6vw,16px);letter-spacing:.02em;border-radius:16px;padding:15px 22px;border:2px solid transparent;transition:transform .08s ease,box-shadow .08s ease;min-height:52px;width:100%}
.btn:active:not(:disabled){transform:translateY(3px)}
.btn-primary{background:var(--accent1);color:#fff;border-color:var(--accent1-dark);box-shadow:0 4px 0 var(--accent1-dark)}
.btn-primary:active:not(:disabled){box-shadow:0 1px 0 var(--accent1-dark)}
.btn-secondary{background:#fff;color:var(--ink);border-color:var(--line);box-shadow:0 4px 0 var(--line)}
.btn-secondary:active:not(:disabled){box-shadow:0 1px 0 var(--line)}
.btn-gold{background:var(--gold);color:var(--gold-text);border-color:var(--gold-dark);box-shadow:0 4px 0 var(--gold-dark)}
.btn-gold:active:not(:disabled){box-shadow:0 1px 0 var(--gold-dark)}
.btn-blue{background:var(--blue);color:#fff;border-color:var(--blue-dark);box-shadow:0 4px 0 var(--blue-dark)}
.btn-blue:active:not(:disabled){box-shadow:0 1px 0 var(--blue-dark)}
.btn-pink{background:var(--accent2);color:#fff;border-color:var(--accent2-dark);box-shadow:0 4px 0 var(--accent2-dark)}
.btn-pink:active:not(:disabled){box-shadow:0 1px 0 var(--accent2-dark)}
.btn-red{background:var(--red);color:#fff;border-color:var(--red-dark);box-shadow:0 4px 0 var(--red-dark)}
.btn-red:active:not(:disabled){box-shadow:0 1px 0 var(--red-dark)}
.btn-wide{width:auto}

/* ── PATH VIEW ── */
.path-wrap{padding:16px 12px 24px;max-width:680px;margin:0 auto;width:100%}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:8px;flex-wrap:wrap}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent1);font-weight:800;margin-bottom:3px}
.signature{font-family:'Dancing Script','Brush Script MT',cursive;font-size:16px;color:var(--ink-soft);letter-spacing:.04em;margin-top:-10px;margin-bottom:14px;opacity:0.85;font-style:italic}
.h1{font-size:clamp(24px,7vw,32px);font-weight:800;color:var(--ink);letter-spacing:-.01em}
.header-badges{display:flex;gap:6px;flex-shrink:0;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.streak-badge{display:flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);border-radius:999px;padding:8px 14px;font-weight:800;font-size:16px;color:var(--ink);flex-shrink:0}
.save-btn{display:flex;align-items:center;justify-content:center;gap:5px;background:var(--accent1);border:2px solid var(--accent1-dark);box-shadow:0 3px 0 var(--accent1-dark);border-radius:999px;padding:7px 14px;font-weight:800;font-size:12px;color:#fff;flex-shrink:0;cursor:pointer;transition:transform .1s;min-width:74px;height:34px}
.save-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--accent1-dark)}
.progress-track{position:relative;height:14px;background:var(--line);border-radius:999px;margin-bottom:8px;overflow:hidden}
.progress-fill{position:absolute;top:0;left:0;height:100%;background:linear-gradient(90deg,var(--accent1),var(--accent2));border-radius:999px;transition:width .6s ease}
.progress-label{font-size:12.5px;color:var(--ink-soft);font-weight:700;display:block;margin-bottom:18px}
.continent-list{display:flex;flex-direction:column;gap:30px}
.chapter-header{display:flex;align-items:center;gap:10px;margin-bottom:6px;background:var(--chap-color,var(--accent1));border-radius:16px;padding:14px 18px;box-shadow:0 3px 0 rgba(0,0,0,0.15)}
.chapter-dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:#fff;flex-shrink:0}
.chapter-title{font-size:17px;font-weight:700;color:#fff;letter-spacing:-.01em;flex:1}
.chapter-sub{font-size:11.5px;color:rgba(255,255,255,0.85);font-weight:700}

.day-path{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px;padding:14px 0 4px}
.day-node-wrap{display:flex;width:100%;justify-content:center;flex-direction:column;align-items:center}
.day-node-outer{position:relative;display:flex}
.relock-btn{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--line);box-shadow:0 2px 0 var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;z-index:2;transition:transform .1s}
.relock-btn:active{transform:translateY(1px);box-shadow:0 1px 0 var(--line)}
.day-node{display:flex;flex-direction:column;align-items:center;justify-content:center;width:clamp(52px,14vw,68px);height:clamp(52px,14vw,68px);border-radius:50%;border:2.5px solid;transition:transform .12s,box-shadow .12s;flex-shrink:0}
.day-node:not(:disabled):active{transform:translateY(3px)}
.day-num{font-size:clamp(18px,5vw,22px);font-weight:800;font-family:var(--font-display);line-height:1}
.day-caption{font-size:10px;color:var(--ink-soft);text-align:center;line-height:1.3;font-weight:700;margin-top:5px;max-width:90px}
.day-caption .flags{font-size:13px;letter-spacing:1px;display:block;margin-bottom:1px}

/* ── LESSON VIEW ── */
.lesson-wrap{padding:16px 16px 110px;max-width:480px;margin:0 auto;width:100%;display:flex;flex-direction:column;flex:1}
.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
.icon-btn{width:44px;height:44px;border-radius:50%;background:#fff;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;transition:transform .1s}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.dots-row{display:flex;gap:6px;flex:1;justify-content:center}
.dot{width:9px;height:9px;border-radius:50%;transition:background .3s}
.lesson-eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:12px;font-weight:800;text-align:center}
.stamp-card{background:var(--card);border:2px solid var(--line);box-shadow:0 4px 0 var(--line),0 0 30px rgba(124,58,237,0.06);border-radius:24px;padding:30px 22px;display:flex;flex-direction:column;align-items:center;text-align:center}
.stamp-flag{font-size:clamp(72px,22vw,96px);line-height:1;display:block;margin-bottom:6px;filter:drop-shadow(0 4px 8px rgba(0,0,0,0.15))}
.stamp-name{font-size:clamp(22px,6vw,28px);font-weight:800;color:var(--ink);margin:6px 0 6px}
.stamp-capital{font-size:13px;font-weight:700;color:var(--blue-dark);background:var(--blue-bg);border-radius:999px;padding:5px 14px;margin-bottom:8px;display:inline-flex;align-items:center;gap:5px}
.stamp-attraction{font-size:13px;font-weight:700;color:var(--accent1);background:rgba(124,58,237,0.08);border-radius:999px;padding:5px 14px;margin-bottom:12px;display:inline-flex;align-items:center;gap:5px;border:1px solid rgba(124,58,237,0.2)}
.stamp-divider{width:40px;height:3px;background:var(--line);border-radius:2px;margin:8px auto 14px}
.stamp-fact{font-size:14.5px;color:var(--ink-soft);line-height:1.6;font-weight:600}
.lesson-footer{display:flex;gap:10px;margin-top:18px}

/* ── DOCK ── */
.dock-bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--line);padding:14px 16px calc(14px + env(safe-area-inset-bottom));z-index:50;max-width:480px;margin:0 auto;display:flex;gap:10px;box-shadow:0 -4px 20px rgba(124,58,237,0.07)}
.dock-bar.path-dock{max-width:680px}

/* ── EMBEDDED GAME (Flag Cam) ── */
.embed-view-wrap{position:fixed;inset:0;z-index:900;display:flex;flex-direction:column;background:#0D0F1A}
.embed-top-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:#0D0F1A;border-bottom:1px solid #2D3555;flex-shrink:0}
.embed-top-bar .icon-btn{background:#141726;border-color:#2D3555;box-shadow:0 3px 0 #2D3555;color:#F0F4FF}
.embed-top-bar .icon-btn:active{box-shadow:0 1px 0 #2D3555}
.embed-top-title{font-family:var(--font-display);font-weight:800;font-size:15px;color:#F0F4FF}
.embed-frame{flex:1;width:100%;border:none;background:#0D0F1A}

/* ── QUIZ VIEW ── */
.quiz-wrap{padding:16px 16px 28px;max-width:480px;margin:0 auto;width:100%;display:flex;flex-direction:column;flex:1}
.quiz-progress-track{flex:1;height:14px;background:var(--line);border-radius:999px;overflow:hidden}
.quiz-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent1),var(--accent2));border-radius:999px;transition:width .4s ease}
.quiz-question-label{font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin:16px 0 10px;text-align:center}
.quiz-flag-wrap{display:flex;justify-content:center;margin-bottom:18px}
.quiz-flag{font-size:clamp(76px,24vw,100px);line-height:1;display:block;filter:drop-shadow(0 6px 12px rgba(0,0,0,0.15));animation:bounceIn .5s ease}
.choices-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:130px}
@media(max-width:340px){.choices-grid{grid-template-columns:1fr}}
.choice-btn{padding:15px 10px;border-radius:16px;background:#fff;border:2px solid var(--line);box-shadow:0 4px 0 var(--line);font-size:14.5px;font-weight:700;color:var(--ink);text-align:center;transition:all .1s;cursor:pointer;line-height:1.3;min-height:54px}
.choice-btn:not(:disabled):active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.choice-btn:not(:disabled):hover{border-color:var(--accent1)}
.choice-correct{background:var(--green-bg) !important;border-color:var(--green) !important;color:var(--green-text) !important;box-shadow:0 4px 0 var(--green-dark) !important}
.choice-wrong{background:var(--red-bg) !important;border-color:var(--red) !important;color:var(--red-text) !important;box-shadow:0 4px 0 var(--red-dark) !important}
.feedback-bar{position:fixed;left:0;right:0;bottom:0;border-top:3px solid;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-width:480px;margin:0 auto;z-index:60;box-shadow:0 -6px 24px rgba(0,0,0,0.1)}
.feedback-heading{font-family:var(--font-display);font-weight:800;font-size:18px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.feedback-fact{font-size:13.5px;line-height:1.5;color:var(--ink-soft);margin-bottom:14px;font-weight:600}
.feedback-attraction{font-size:12.5px;font-weight:700;color:var(--accent1);background:rgba(124,58,237,0.08);border-radius:10px;padding:6px 10px;margin-bottom:8px;display:flex;align-items:center;gap:5px}

/* ── LOOKALIKE FLAGS: DRAG & DROP MATCHING ── */
.matchflags-grid{display:flex;flex-direction:column;gap:14px;margin-bottom:22px}
.matchflag-slot{background:#fff;border:2.5px dashed var(--line);border-radius:18px;padding:14px 18px;display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:18px;min-height:88px;transition:border-color .15s,background .15s,transform .12s;cursor:pointer}
.matchflag-emoji{font-size:clamp(48px,14vw,64px);line-height:1;filter:drop-shadow(0 3px 6px rgba(0,0,0,0.12));flex-shrink:0}
.matchflag-label{font-size:18px;font-weight:800;color:var(--ink-soft);text-align:left;letter-spacing:.01em}
.matchflag-slot.drag-over{border-style:solid;border-color:var(--accent1);background:rgba(124,58,237,0.07);transform:scale(1.02)}
.matchflag-slot.filled{border-style:solid;border-color:var(--accent1);background:rgba(124,58,237,0.07)}
.matchflag-slot.filled .matchflag-label{color:var(--accent1-dark)}
.matchflag-slot.correct{border-style:solid;border-color:var(--green);background:var(--green-bg);cursor:default}
.matchflag-slot.correct .matchflag-label{color:var(--green-text)}
.matchflag-slot.wrong{border-style:solid;border-color:var(--red);background:var(--red-bg);cursor:default}
.matchflag-slot.wrong .matchflag-label{color:var(--red-text)}
.matchflag-slot.shake-wrong{animation:wobble .4s ease;border-color:var(--red);background:var(--red-bg)}
.matchchips-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:150px}
.matchchip{background:#fff;border:2px solid var(--line);box-shadow:0 4px 0 var(--line);border-radius:14px;padding:12px 16px;font-weight:700;font-size:14px;color:var(--ink);cursor:grab;user-select:none;transition:transform .1s,box-shadow .1s,opacity .15s}
.matchchip.selected{border-color:var(--accent1);box-shadow:0 4px 0 var(--accent1-dark);background:rgba(124,58,237,0.07);color:var(--accent1-dark)}
.matchchip-source-hidden{opacity:0.22}
.matchchip-drag{box-shadow:0 10px 22px rgba(0,0,0,0.28) !important;transform:scale(1.06) rotate(-2deg);cursor:grabbing}
@media(max-width:400px){
  .matchflags-grid{gap:10px}
  .matchflag-slot{min-height:76px;padding:10px 14px;gap:14px}
  .matchflag-emoji{font-size:clamp(38px,15vw,50px)}
  .matchflag-label{font-size:15px}
  .matchchips-row{margin-bottom:160px}
}

/* ── RESULT VIEW ── */
.result-wrap{padding:40px 22px 48px;max-width:480px;margin:0 auto;width:100%;display:flex;flex-direction:column;align-items:center;text-align:center;flex:1;justify-content:center}
.result-title{font-size:clamp(22px,6.5vw,28px);font-weight:800;color:var(--ink);margin-bottom:4px}
.result-subtitle{font-size:13px;color:var(--ink-soft);margin-bottom:24px;text-transform:uppercase;letter-spacing:.05em;font-weight:800}
.result-stats-row{display:flex;gap:14px;margin-bottom:22px;flex-wrap:wrap;justify-content:center}
.result-stat{display:flex;flex-direction:column;align-items:center;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 18px;min-width:84px}
.result-stat-num{font-size:22px;font-weight:800;color:var(--ink);font-family:var(--font-display)}
.result-stat-label{font-size:11px;color:var(--ink-soft);margin-top:2px;font-weight:700}
.result-message{font-size:14.5px;line-height:1.6;color:var(--ink-soft);margin-bottom:26px;max-width:360px;font-weight:600}
.result-actions{display:flex;flex-direction:column;gap:10px;width:100%;max-width:300px}

/* ── QUICK 5 BANNER ── */
.quick5-banner{background:linear-gradient(135deg,var(--accent1),var(--accent2));border-radius:20px;padding:22px;margin-top:14px;text-align:center;color:#fff;position:relative;overflow:hidden;box-shadow:0 4px 0 rgba(0,0,0,0.15)}
.quick5-banner::before{content:'⚡';position:absolute;top:10px;right:16px;font-size:46px;opacity:.18;line-height:1}
.dashboard-banner::before{content:'📊'}
.review-banner::before{content:'🔁'}
.review-banner{background:linear-gradient(135deg,var(--green),var(--blue))}
.review-due-pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.22);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:800;margin-bottom:10px}

.continent-filter-list{display:flex;flex-direction:column;gap:8px;max-height:44vh;overflow-y:auto;margin:14px 0}
.continent-filter-row{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:#fff;font-family:var(--font-body);transition:border-color .15s,background .15s}
.continent-filter-row:disabled{opacity:.4;cursor:default}
.continent-filter-row-active{border-color:var(--chip-color,var(--accent1));background:var(--bg-soft)}
.continent-filter-check{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#fff;flex-shrink:0}
.continent-filter-row-active .continent-filter-check{background:var(--chip-color,var(--accent1));border-color:var(--chip-color,var(--accent1))}
.continent-filter-name{flex:1;text-align:left;font-weight:800;font-size:14.5px;color:var(--ink)}
.continent-filter-count{font-size:12px;font-weight:800;color:var(--ink-soft);background:var(--bg-soft);border-radius:999px;padding:3px 10px}
.quick5-title{font-size:21px;font-weight:800;margin-bottom:4px;font-family:var(--font-display)}
.quick5-subtitle{font-size:12.5px;opacity:.9;margin-bottom:16px;font-weight:700}
.quick5-pips{display:flex;justify-content:center;gap:5px;margin-bottom:18px;flex-wrap:wrap}
.quick5-pip{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,0.18);border:2px solid rgba(255,255,255,0.35);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff}

/* ── CONFETTI ── */
.confetti-piece{position:fixed;width:10px;height:10px;border-radius:2px;pointer-events:none;z-index:9999;animation:confettiFall linear forwards}

/* Pronunciation button on the daily lesson stamp card */

/* Build a 30-day path (5 flags/day) ordered purely by popularity,
   ignoring continent boundaries entirely. */
const POPULARITY_DAYS = (()=>{
  const byName={}; ALL_COUNTRIES.forEach(c=>{ byName[c.name]=c; });
  const ordered=POPULARITY_ORDER.map(n=>byName[n]).filter(Boolean);
  // In case any country was missing from POPULARITY_ORDER, tack it on the end.
  const seen=new Set(ordered.map(c=>c.name));
  ALL_COUNTRIES.forEach(c=>{ if(!seen.has(c.name)){ ordered.push(c); seen.add(c.name); } });

  const days=[];
  for(let i=0;i<ordered.length;i+=5){
    const chunk=ordered.slice(i,i+5);
    if(!chunk.length) continue;
    const dayNum=days.length+1;
    days.push({day:dayNum,continent:"popular",title:`Top ${i+1}–${i+chunk.length}`,countries:chunk});
  }
  return days;
})();

/* George & Charlie's 30-day popularity path is split into 5 chapters
   ("batches") of 6 days each — Flags Batch 1 through Flags Batch 5 —
   so the path view reads as five manageable chunks instead of one
   long list. */
const POPULARITY_BATCH_COLORS = [
  {color:"#1CB0F6",colorDark:"#0A91D6"},
  {color:"#7C3AED",colorDark:"#5B21B6"},
  {color:"#FF9600",colorDark:"#E07F00"},
  {color:"#58CC02",colorDark:"#4BA000"},
  {color:"#EC4899",colorDark:"#BE185D"},
];
const POPULARITY_CONTINENTS = (()=>{
  const DAYS_PER_BATCH=6;
  const batches=[];
  for(let i=0;i<POPULARITY_DAYS.length;i+=DAYS_PER_BATCH){
    const chunk=POPULARITY_DAYS.slice(i,i+DAYS_PER_BATCH);
    if(!chunk.length) continue;
    const batchNum=batches.length+1;

  }
  return batches;
})();

/* ================================================================
   SPACED REPETITION SCHEDULE
   Each completed day gets its own review schedule: 1, 3, 7, 10, and
   15 days after it's learned, then progressively further apart
   (×1.6 each time) for flags that keep getting reviewed successfully.
   Missing a review just pushes it to tomorrow instead of losing
   progress, so the schedule always keeps moving forward.
================================================================ */
const REVIEW_INTERVALS_DAYS = [1,3,7,10,15];
const DAY_MS = 24*60*60*1000;
function intervalForStage(stage){
  if(stage<REVIEW_INTERVALS_DAYS.length) return REVIEW_INTERVALS_DAYS[stage];
  let last=REVIEW_INTERVALS_DAYS[REVIEW_INTERVALS_DAYS.length-1];
  for(let i=REVIEW_INTERVALS_DAYS.length;i<=stage;i++){ last=Math.round(last*1.6); }
  return last;
}

const SAVE_KEY_BASE = "flagatlas_save_v1";

function saveKeyFor(profileId){
  return `${SAVE_KEY_BASE}_${profileId}`;
}

/* Shared shape of everything that gets persisted. */
function buildSaveData(){
  return {
    unlockedDay: STATE.unlockedDay,
    completedDays: STATE.completedDays,
    streak: STATE.streak,
    correctCounts: STATE.correctCounts,
    collapsedContinents: STATE.collapsedContinents,

}

/* Writes to localStorage. Used for lightweight changes (like
   bookmarking) that should persist immediately without a toast. */
function saveLocalOnly(){
  const SAVE_KEY = saveKeyFor(STATE.profile);
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(buildSaveData())); }catch(e){}
}

function saveState(){
  const SAVE_KEY = saveKeyFor(STATE.profile);
  const toSave=buildSaveData();
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify(toSave));
    showToast("✅ Progress saved!");
  } catch(e){

  } else {

function loadState(profileId){
  const SAVE_KEY = saveKeyFor(profileId);
  // Reset in-memory state first so switching profiles never leaks
  // progress from whoever played before.
  STATE.unlockedDay=1;
  STATE.completedDays=[];
  STATE.streak=0;
  STATE.correctCounts={};
  STATE.collapsedContinents=[];
  STATE.collapsedDashboard=[];
  STATE.quick5History=[];
  STATE.reviewSchedule={};
  STATE.bookmarkedFlags=[];

  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw){ backfillReviewSchedule(); return; }
    const saved=JSON.parse(raw);
    STATE.unlockedDay = saved.unlockedDay ?? 1;
    STATE.completedDays = saved.completedDays ?? [];
    STATE.streak = saved.streak ?? 0;
    STATE.correctCounts = saved.correctCounts ?? {};
    STATE.collapsedContinents = saved.collapsedContinents ?? [];
    STATE.collapsedDashboard = saved.collapsedDashboard ?? [];
    STATE.quick5History = saved.quick5History ?? [];
    STATE.reviewSchedule = saved.reviewSchedule ?? {};
    STATE.bookmarkedFlags = saved.bookmarkedFlags ?? [];
  } catch(e){}
  backfillReviewSchedule();
}

/* Any completed day that predates this feature (or somehow has no
   schedule yet) is entered into the review cycle as due right away,
   so existing progress starts benefiting from spaced review immediately. */
function backfillReviewSchedule(){
  const now=Date.now();
  STATE.completedDays.forEach(dayNum=>{
    if(!STATE.reviewSchedule[dayNum]){
      STATE.reviewSchedule[dayNum]={stage:0,dueAt:now,lastReviewedAt:null};
    }
  });
}

function flagEmojiToIso2(flag){
  // Each flag emoji is two "regional indicator" code points, A-Z offset by 0x1F1E6.
  const chars=[...flag];
  if(chars.length<2) return null;
  const codes=chars.map(c=>c.codePointAt(0)-0x1F1E6);
  if(codes.some(n=>n<0||n>25)) return null;
  return codes.map(n=>String.fromCharCode(97+n)).join("");
}

        <button class="btn btn-secondary" id="cfCancel">✕ Cancel</button>

  quick5ContinentFilter: [],

  lookalikeQIndex: 0,

/* ================================================================
   HELPERS
================================================================ */
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function dayLookup(n){return ACTIVE_DAYS.find(d=>d.day===n);}

/* Weighted sample (no replacement) that favors countries with fewer
   correct Flag Match answers — flags with 0 or few correct answers
   are more likely to be picked. Uses the Efraimidis-Spirakis weighted
   random sampling method. */
function weightedTakeByLowCount(arr,n,nameFn){
  nameFn = nameFn || (c=>c.name);
  const keyed=arr.map(c=>{
    const count=STATE.correctCounts[nameFn(c)]||0;
    const weight=1/(1+count);
    const key=Math.pow(Math.random(),1/weight);
    return {c,key};
  });
  keyed.sort((a,b)=>b.key-a.key);
  return keyed.slice(0,n).map(x=>x.c);
}

/* Picks distractors that are harder to eliminate: same-continent countries
   are pulled first (so choices can't be ruled out just by "wrong region"),
   falling back to any other country only if the region runs short. */
function pickHardDistractors(correct, pool, count){
  const continent=COUNTRY_CONTINENT[correct.name];
  const sameContinent=pool.filter(x=>x.name!==correct.name&&COUNTRY_CONTINENT[x.name]===continent);
  const elsewhere=pool.filter(x=>x.name!==correct.name&&COUNTRY_CONTINENT[x.name]!==continent);
  let picks=shuffle(sameContinent).slice(0,count);
  if(picks.length<count){
    picks=[...picks,...shuffle(elsewhere).slice(0,count-picks.length)];
  }
  return picks;
}

/* Picks the toughest possible distractors for Flag Match: known
   commonly-confused "lookalike" flags first (e.g. Romania/Moldova),
   then falls back to same-continent countries (via pickHardDistractors)
   if the country has no lookalike group or it runs short. */
function pickDistractorsWithLookalikes(correct, pool, count, excludeNames){
  excludeNames = excludeNames || new Set();
  const group=LOOKALIKE_GROUPS.find(g=>g.includes(correct.name));
  let picks=[];
  if(group){
    const lookalikeCountries=group
      .filter(n=>n!==correct.name&&!excludeNames.has(n))
      .map(n=>ALL_COUNTRIES.find(x=>x.name===n))
      .filter(Boolean);
    picks=shuffle(lookalikeCountries).slice(0,count);
  }
  if(picks.length<count){
    const usedNames=new Set([correct.name,...excludeNames,...picks.map(p=>p.name)]);
    const remaining=count-picks.length;
    const hardPicks=pickHardDistractors(correct, pool.filter(x=>!usedNames.has(x.name)), remaining);
    picks=[...picks,...hardPicks];
  }
  return picks;
}

function buildDayQuiz(dayData){
  return shuffle(dayData.countries.map(c=>{
    const wrong=pickDistractorsWithLookalikes(c,ALL_COUNTRIES,3);
    const choices=shuffle([c,...wrong]);
    return {type:"flag",flag:c.flag,answer:c.name,fact:c.fact,capital:c.capital,attraction:c.attraction,choices:choices.map(x=>x.name)};
  }));
}

function getCollectedCountries(){
  return Array.from(
    new Map(
      ACTIVE_DAYS.filter(d=>STATE.completedDays.includes(d.day))
          .flatMap(d=>d.countries)
          .map(c=>[c.name,c])
    ).values()
  );
}

/* Called the first time a day is passed. Puts it on the spaced-review
   schedule starting at stage 0 (due in 1 day). Does nothing if the
   day is already scheduled, so replaying/retrying a day never resets
   its review progress. */
function scheduleReviewIfNeeded(dayNum){
  if(STATE.reviewSchedule[dayNum]) return;
  const now=Date.now();
  STATE.reviewSchedule[dayNum]={stage:0,dueAt:now+intervalForStage(0)*DAY_MS,lastReviewedAt:null};
}

/* Days that are due for review right now (or overdue), soonest-due first. */
function getDueReviewDays(){
  const now=Date.now();
  return STATE.completedDays
    .filter(n=>STATE.reviewSchedule[n]&&STATE.reviewSchedule[n].dueAt<=now)
    .sort((a,b)=>STATE.reviewSchedule[a].dueAt-STATE.reviewSchedule[b].dueAt);
}

/* Timestamp of the soonest review that isn't due yet, for the
   "all caught up" message. Returns null if nothing is scheduled. */
function getNextUpcomingReviewAt(){
  const now=Date.now();
  const upcoming=STATE.completedDays
    .filter(n=>STATE.reviewSchedule[n]&&STATE.reviewSchedule[n].dueAt>now)
    .sort((a,b)=>STATE.reviewSchedule[a].dueAt-STATE.reviewSchedule[b].dueAt);
  return upcoming.length?STATE.reviewSchedule[upcoming[0]].dueAt:null;
}

/* Builds a mixed round drawing from every due day's flags (capped at
   15 so a big backlog doesn't turn into a marathon). Each question
   remembers which day it came from (sourceDay) so results can be
   scored and rescheduled per-day afterward. */
function buildReviewQuiz(dueDayNums){
  let items=[];
  dueDayNums.forEach(dn=>{
    const day=dayLookup(dn);
    if(!day) return;
    day.countries.forEach(c=>{ items.push({...c,sourceDay:dn}); });
  });
  items=shuffle(items).slice(0,15);
  return items.map(c=>{
    const wrong=pickDistractorsWithLookalikes(c,ALL_COUNTRIES,3);
    return {type:"flag",flag:c.flag,answer:c.name,fact:c.fact,capital:c.capital,attraction:c.attraction,
      choices:shuffle([c,...wrong]).map(x=>x.name),sourceDay:c.sourceDay};
  });
}

/* After a review round ends, grades each involved day independently:
   ≥60% correct advances it to the next interval; otherwise it's
   rescheduled for tomorrow at the same stage instead of losing
   progress, so a bad day never resets a flag's whole schedule. */
function finishReviewSession(){
  const now=Date.now();
  Object.entries(STATE.reviewDayResults).forEach(([dayStr,res])=>{
    const dayNum=Number(dayStr);
    const sched=STATE.reviewSchedule[dayNum];
    if(!sched) return;
    const passed=(res.correct/res.total)>=0.6;
    if(passed){
      sched.stage=sched.stage+1;
      sched.dueAt=now+intervalForStage(sched.stage)*DAY_MS;
    } else {
      sched.dueAt=now+DAY_MS;
    }
    sched.lastReviewedAt=now;
  });
}

/* Practice quiz (Flag Match) size: 5-flag round for everyone. */
function quick5QuizSize(){
  return 5;
}

function buildQuick5Quiz(){
  let collected=getCollectedCountries();
  const contFilter=STATE.quick5ContinentFilter||[];
  if(contFilter.length){
    collected=collected.filter(c=>contFilter.includes(COUNTRY_CONTINENT[c.name]));
  }
  if(collected.length<4) return [];
  const SIZE=quick5QuizSize();

  // Avoid repeating flags used in the last 3 rounds (up to 24 flags), falling
  // back to the least-recently-used ones only if the collected pool is too
  // small to fill a full round without repeats.
  const history=STATE.quick5History||[];
  const excluded=new Set(history);
  const available=collected.filter(c=>!excluded.has(c.name));

  let pool;
  if(available.length>=SIZE){
    pool=weightedTakeByLowCount(available,SIZE);
  } else {
    const need=SIZE-available.length;
    const orderedFallback=weightedTakeByLowCount(
      history.map(name=>collected.find(c=>c.name===name)).filter(Boolean),
      need
    );
    pool=shuffle([...available, ...orderedFallback]);
  }
  pool=pool.slice(0,Math.min(SIZE,pool.length));
  pool=shuffle(pool);

  const usedNames=pool.map(c=>c.name);
  STATE.quick5History=[...history.filter(n=>!usedNames.includes(n)),...usedNames].slice(-(SIZE*2));

  return pool.map(c=>{
    let wrong=pickDistractorsWithLookalikes(c,collected,3);
    if(wrong.length<3){
      const usedNames=new Set([c.name,...wrong.map(w=>w.name)]);
      const extraPool=ALL_COUNTRIES.filter(x=>!usedNames.has(x.name));
      wrong=[...wrong,...pickDistractorsWithLookalikes(c,extraPool,3-wrong.length,usedNames)];
    }
    return {type:"flag",flag:c.flag,question:"Which country does this flag belong to?",answer:c.name,choices:shuffle([c,...wrong]).map(x=>x.name),fact:c.fact,capital:c.capital,attraction:c.attraction,badge:"flag"};
  });
}

/* Builds drag-and-drop matching rounds: each round is a group of
   commonly-confused flags (2-4 of them) shown together, and the
   player drags each country name chip onto its matching flag. */
function buildLookalikeQuiz(){
  const collected=getCollectedCountries();
  const collectedNames=new Set(collected.map(c=>c.name));
  const eligible=LOOKALIKE_GROUPS
    .map(g=>g.filter(n=>ALL_COUNTRIES.some(c=>c.name===n)))
    .filter(g=>g.length>=2&&g.some(n=>collectedNames.has(n)));
  if(eligible.length<3) return [];
  const chosenGroups=shuffle(eligible).slice(0,5);
  return chosenGroups.map(group=>{
    const groupCountries=shuffle(group.map(n=>ALL_COUNTRIES.find(c=>c.name===n)).filter(Boolean));
    const countries=groupCountries.map(c=>({name:c.name,flag:c.flag,fact:c.fact,capital:c.capital,attraction:c.attraction}));
    return {
      countries,
      flagOrder: shuffle(countries.map(c=>c.name)),
      chipOrder: shuffle(countries.map(c=>c.name)),
    };
  });
}

/* Sets up a fresh Lookalike Flags round-set and enters the game. */
function startLookalikeQuiz(){
  STATE.lookalikeQuiz=buildLookalikeQuiz();
  STATE.lookalikeTotal=STATE.lookalikeQuiz.reduce((sum,r)=>sum+r.countries.length,0);
  STATE.lookalikeQIndex=0;
  STATE.lookalikeMatched={};
  STATE.lookalikePlaced={};
  STATE.lookalikeSubmitted=false;
  STATE.lookalikeScore=0;
  STATE.view="lookalike";
  render();
}

function launchConfetti(count=40){
  const colors=["#7C3AED","#EC4899","#1CB0F6","#FFC800","#FF9600","#58CC02"];
  for(let i=0;i<count;i++){
    const el=document.createElement("div");
    el.className="confetti-piece";
    el.style.left=Math.random()*100+"vw";
    el.style.top="-20px";
    el.style.background=colors[Math.floor(Math.random()*colors.length)];
    el.style.width=(6+Math.random()*10)+"px";
    el.style.height=(6+Math.random()*10)+"px";
    el.style.borderRadius=Math.random()>0.5?"50%":"2px";
    el.style.animationDuration=(1.2+Math.random()*1.5)+"s";
    el.style.animationDelay=(Math.random()*0.6)+"s";
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),3000);
  }
}

function loadFlagMapFrame(){
  const frame=document.getElementById("flagMapFrame");
  const src=document.getElementById("flagMapSrc");
  if(!frame||!src||frame.dataset.loaded==="1") return;
  const closeTag="</scr"+"ipt>";
  let html=src.textContent.replace(/<\\\/script>/g,closeTag);

  /* Give this player their own Flag Map country pool — same profile
     pattern used everywhere else. */
  const poolKey = `flagscope_${STATE.profile}_pool`;
  html = html.replaceAll("'flagscope_unlocked_pool'", JSON.stringify(poolKey));

  /* Tell Flag Map which countries this player has actually unlocked
     in the daily-learning path, so its "Unlocked" pool reflects real
     progress instead of a fixed starter list. */
  const unlockedNames = getCollectedCountries().map(c=>c.name);
  html = html.replace(
    "const ALL_CODES = FLAGS.map(f=>f.code);",
    `const INJECTED_UNLOCKED_NAMES = ${JSON.stringify(unlockedNames)};\nconst ALL_CODES = FLAGS.map(f=>f.code);`
  );

  /* Match whichever font the player currently has selected
     (this app names its variables --font-disp/--font-mono). */
  const f = currentFont();
  html = html.replace("</head>", `<style>:root{--font-disp:${f.display} !important;--font-mono:${f.body} !important;}</style></head>`);

  frame.srcdoc=html;
  frame.dataset.loaded="1";
}

/* ================================================================
   LOOKALIKE FLAGS — DRAG & DROP LOGIC
   Supports real drag (mouse + touch via Pointer Events) as well as
   a tap-to-select / tap-to-place fallback for trickier touchscreens.
================================================================ */
function placeLookalikeChip(chipName, slotName){
  if(STATE.lookalikeSubmitted) return;
  Object.keys(STATE.lookalikePlaced).forEach(k=>{
    if(STATE.lookalikePlaced[k]===chipName) delete STATE.lookalikePlaced[k];
  });
  STATE.lookalikePlaced[slotName]=chipName;
  render();
}

function unplaceLookalikeSlot(slotName){
  if(STATE.lookalikeSubmitted) return;
  if(!STATE.lookalikePlaced[slotName]) return;
  delete STATE.lookalikePlaced[slotName];
  render();
}

function submitLookalikeRound(){
  if(STATE.lookalikeSubmitted) return;
  const round=STATE.lookalikeQuiz[STATE.lookalikeQIndex];
  const correctCount=round.countries.filter(c=>STATE.lookalikePlaced[c.name]===c.name).length;
  STATE.lookalikeScore+=correctCount;
  STATE.lookalikeSubmitted=true;
  if(correctCount===round.countries.length) launchConfetti(30);
  render();
}

function initLookalikeDrag(){
  if(STATE.lookalikeSubmitted) return;
  document.querySelectorAll(".matchchip").forEach(chip=>{
    chip.style.touchAction="none";
    chip.addEventListener("pointerdown",e=>{
      e.preventDefault();
      let moved=false;
      const startX=e.clientX, startY=e.clientY;
      const rect=chip.getBoundingClientRect();
      const offsetX=startX-rect.left, offsetY=startY-rect.top;
      const clone=chip.cloneNode(true);
      clone.classList.add("matchchip-drag");
      clone.style.position="fixed";
      clone.style.left=rect.left+"px";
      clone.style.top=rect.top+"px";
      clone.style.width=rect.width+"px";
      clone.style.pointerEvents="none";
      clone.style.margin="0";
      clone.style.zIndex="9999";
      document.body.appendChild(clone);
      chip.classList.add("matchchip-source-hidden");

      function onMove(ev){
        const dx=ev.clientX-startX, dy=ev.clientY-startY;
        if(Math.abs(dx)>5||Math.abs(dy)>5) moved=true;
        clone.style.left=(ev.clientX-offsetX)+"px";
        clone.style.top=(ev.clientY-offsetY)+"px";
        const el=document.elementFromPoint(ev.clientX,ev.clientY);
        const slot=el&&el.closest(".matchflag-slot");
        document.querySelectorAll(".matchflag-slot.drag-over").forEach(s=>s.classList.remove("drag-over"));
        if(slot) slot.classList.add("drag-over");
      }
      function onUp(ev){
        document.removeEventListener("pointermove",onMove);
        clone.remove();
        chip.classList.remove("matchchip-source-hidden");
        document.querySelectorAll(".matchflag-slot.drag-over").forEach(s=>s.classList.remove("drag-over"));
        if(moved){
          const el=document.elementFromPoint(ev.clientX,ev.clientY);
          const slot=el&&el.closest(".matchflag-slot");
          if(slot) placeLookalikeChip(chip.dataset.chip,slot.dataset.flagslot);
        } else {
          const wasSelected=chip.classList.contains("selected");
          document.querySelectorAll(".matchchip.selected").forEach(c=>c.classList.remove("selected"));
          if(!wasSelected) chip.classList.add("selected");
        }
      }
      document.addEventListener("pointermove",onMove);
      document.addEventListener("pointerup",onUp,{once:true});
    });
  });
  document.querySelectorAll(".matchflag-slot").forEach(slot=>{
    slot.addEventListener("click",()=>{
      const slotName=slot.dataset.flagslot;
      if(slot.classList.contains("filled")){ unplaceLookalikeSlot(slotName); return; }
      const sel=document.querySelector(".matchchip.selected");
      if(sel){ sel.classList.remove("selected"); placeLookalikeChip(sel.dataset.chip,slotName); }
    });
  });
}

/* ================================================================
   EVENT BINDING
================================================================ */
function bindEvents(){
  const $ = id=>document.getElementById(id);
  const on = (id,ev,fn)=>{const el=$(id);if(el)el.addEventListener(ev,fn);};

  /* PROFILE SELECT */
  document.querySelectorAll("[data-profile]").forEach(btn=>{
    btn.addEventListener("click",async()=>{
      await selectProfile(btn.dataset.profile);
    });
  });

  on("switchPlayerBtn","click",()=>{ STATE.view="profileSelect"; render(); });
  on("fontToggleBtn","click",()=>{ toggleFont(); render(); });
  on("openBookmarksBtn","click",()=>{ STATE.view="bookmarks"; render(); });
  on("quitBookmarks","click",()=>{ STATE.view="path"; render(); });
  document.querySelectorAll("[data-unbookmark]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      toggleBookmark(btn.dataset.unbookmark);
      render();
    });
  });
  on("devModeTrigger","click",()=>{ showDevPasswordModal(); });

  /* PATH */
  document.querySelectorAll("[data-day]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const day=parseInt(btn.dataset.day);
      if(day>STATE.unlockedDay&&!STATE.devMode)return;
      STATE.activeDay=dayLookup(day);
      STATE.cardIndex=0;
      STATE.view="lesson";
      render();
    });
  });
  document.querySelectorAll("[data-relock]").forEach(btn=>{
    btn.addEventListener("click",(ev)=>{
      ev.stopPropagation();
      const day=parseInt(btn.dataset.relock);
      if(!confirm(`Re-lock Day ${day}? This will mark it as not completed so it can be redone.`))return;
      STATE.completedDays=STATE.completedDays.filter(n=>n!==day);
      if(day<STATE.unlockedDay) STATE.unlockedDay=day;
      saveState();
      render();
    });
  });
  on("openQuickHub","click",()=>{STATE.view="quickHub";render();});
  on("openReviewHub","click",()=>{STATE.view="reviewHub";render();});
  on("openDashboard","click",()=>{STATE.view="dashboard";render();});
  on("quitDashboard","click",()=>{STATE.view="path";render();});
  on("saveBtn","click",()=>saveState());
  document.querySelectorAll("[data-continent]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const id=btn.dataset.continent;
      const idx=STATE.collapsedContinents.indexOf(id);
      if(idx>-1) STATE.collapsedContinents.splice(idx,1);
      else STATE.collapsedContinents.push(id);
      render();
    });
  });
  document.querySelectorAll("[data-dashcontinent]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const id=btn.dataset.dashcontinent;
      const idx=STATE.collapsedDashboard.indexOf(id);
      if(idx>-1) STATE.collapsedDashboard.splice(idx,1);
      else STATE.collapsedDashboard.push(id);
      render();
    });
  });
  document.querySelectorAll("[data-resetcontinent]").forEach(btn=>{
    btn.addEventListener("click",(e)=>{
      e.stopPropagation();
      const id=btn.dataset.resetcontinent;
      const cont=CONTINENTS.find(c=>c.id===id);
      const contName=cont?cont.name:"this continent";
      showConfirmModal({
        title:"🗑️ Reset stats?",
        body:`This clears all Flag Match correct-answer counts for <strong>${contName}</strong>. This can't be undone.`,
        confirmLabel:"Reset",
        cancelLabel:"Cancel",
        onConfirm:()=>{
          ALL_COUNTRIES.filter(c=>COUNTRY_CONTINENT[c.name]===id).forEach(c=>{
            delete STATE.correctCounts[c.name];
          });
          render();
          showToast(`${contName} stats reset`);
        }
      });
    });
  });

  /* LESSON */
  on("lessonBack","click",()=>{STATE.view="path";render();});
  on("prevCard","click",()=>{STATE.cardIndex--;render();});
  on("nextCard","click",()=>{STATE.cardIndex++;render();});
  on("startQuiz","click",()=>{
    STATE.quiz=buildDayQuiz(STATE.activeDay);
    STATE.qIndex=0;STATE.selected=null;STATE.score=0;
    STATE.view="quiz";render();
  });
  const zoomBtn=$("zoomFlagBtn");
  if(zoomBtn) zoomBtn.addEventListener("click",()=>showFlagZoom(zoomBtn.dataset.flag));
  on("bookmarkFlagBtn","click",()=>{
    toggleBookmark($("bookmarkFlagBtn").dataset.name);
    render();
  });
  const pronounceBtn=$("pronounceBtn");
  if(pronounceBtn) pronounceBtn.addEventListener("click",()=>speakCountryName(pronounceBtn.dataset.country,pronounceBtn));

  /* QUIZ */
  on("quitQuiz","click",()=>{STATE.view="path";render();});
  document.querySelectorAll("[data-choice]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      if(STATE.selected)return;
      const ch=btn.dataset.choice;
      STATE.selected=ch;
      const correct=ch===STATE.quiz[STATE.qIndex].answer;
      if(correct){STATE.score++;launchConfetti(20);}
      render();
    });
  });
  on("nextQ","click",()=>{
    if(STATE.qIndex+1>=STATE.quiz.length){
      const passed=STATE.score>=Math.ceil(STATE.quiz.length*0.6);
      if(passed&&STATE.activeDay.day===STATE.unlockedDay){
        STATE.unlockedDay=Math.min(TOTAL_DAYS+1,STATE.unlockedDay+1);
        STATE.completedDays=[...new Set([...STATE.completedDays,STATE.activeDay.day])];
        STATE.streak++;
        scheduleReviewIfNeeded(STATE.activeDay.day);
        launchConfetti(60);
      } else if(passed){
        STATE.completedDays=[...new Set([...STATE.completedDays,STATE.activeDay.day])];
        scheduleReviewIfNeeded(STATE.activeDay.day);
      }
      STATE.view="result";render();
    } else {
      STATE.qIndex++;STATE.selected=null;render();
    }
  });

  /* RESULT */
  on("retryQuiz","click",()=>{
    STATE.quiz=buildDayQuiz(STATE.activeDay);
    STATE.qIndex=0;STATE.selected=null;STATE.score=0;
    STATE.view="quiz";render();
  });
  on("backToPath","click",()=>{STATE.view="path";STATE.activeDay=null;render();});

  /* QUICK QUIZ HUB */
  on("quitHub","click",()=>{STATE.view="path";render();});
  on("backToHub","click",()=>{STATE.view="quickHub";render();});
  on("playGame1","click",()=>{
    showContinentFilterModal((continents)=>{
      STATE.quick5ContinentFilter=continents;
      const quiz=buildQuick5Quiz();
      if(!quiz.length){
        showToast("⚠️ Not enough stamps in that selection — pick more continents");
        return;
      }
      STATE.quick5Quiz=quiz;
      STATE.quick5QIndex=0;
      STATE.quick5Selected=null;
      STATE.quick5Score=0;
      STATE.view="quick5";
      render();
    });
  });
  on("playGame2","click",()=>{ startLookalikeQuiz(); });
  on("playFlagMap","click",()=>{ STATE.view="flagmap"; render(); });
  on("quitFlagMap","click",()=>{
    const frame=document.getElementById("flagMapFrame");
    if(frame) frame.dataset.loaded="";
    STATE.view="quickHub";
    render();
  });
  on("fontToggleBtnFlagMap","click",()=>{ toggleFont(); });

  /* QUICK 5 */
  on("quitQ5","click",()=>{STATE.view="quickHub";render();});
  document.querySelectorAll("[data-q5choice]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      if(STATE.quick5Selected)return;
      const ch=btn.dataset.q5choice;
      STATE.quick5Selected=ch;
      const answer=STATE.quick5Quiz[STATE.quick5QIndex].answer;
      const correct=ch===answer;
      if(correct){
        STATE.quick5Score++;
        STATE.correctCounts[answer]=(STATE.correctCounts[answer]||0)+1;
        if(Math.random()<0.5) launchConfetti(15);
      }
      render();
    });
  });
  on("nextQ5","click",()=>{
    if(STATE.quick5QIndex+1>=STATE.quick5Quiz.length){
      if(STATE.quick5Score>=Math.ceil(STATE.quick5Quiz.length*0.75))launchConfetti(80);
      STATE.view="quick5result";render();
    } else {
      STATE.quick5QIndex++;STATE.quick5Selected=null;render();
    }
  });
  on("retryQ5","click",()=>{
    const quiz=buildQuick5Quiz();
    if(!quiz.length){
      showToast("⚠️ Not enough stamps in that selection anymore");
      STATE.view="quickHub";render();
      return;
    }
    STATE.quick5Quiz=quiz;
    STATE.quick5QIndex=0;STATE.quick5Selected=null;STATE.quick5Score=0;
    STATE.view="quick5";render();
  });

  /* LOOKALIKE FLAGS (Game 2) — drag & drop matching */
  on("quitLookalike","click",()=>{STATE.view="quickHub";render();});
  if(STATE.view==="lookalike") initLookalikeDrag();
  on("submitLookalike","click",()=>{ submitLookalikeRound(); });
  on("nextLookalike","click",()=>{
    if(STATE.lookalikeQIndex+1>=STATE.lookalikeQuiz.length){
      if(STATE.lookalikeScore===STATE.lookalikeTotal)launchConfetti(80);
      STATE.view="lookalikeresult";render();
    } else {
      STATE.lookalikeQIndex++;STATE.lookalikeMatched={};STATE.lookalikePlaced={};STATE.lookalikeSubmitted=false;render();
    }
  });
  on("retryLookalike","click",()=>{ startLookalikeQuiz(); });

  /* SPACED REVIEW */
  on("quitReviewHub","click",()=>{STATE.view="path";render();});
  on("startReview","click",()=>{
    const due=getDueReviewDays();
    STATE.reviewDueDays=due;
    STATE.reviewQuiz=buildReviewQuiz(due);
    STATE.reviewQIndex=0;STATE.reviewSelected=null;STATE.reviewScore=0;STATE.reviewDayResults={};
    STATE.view="reviewQuiz";render();
  });
  on("quitReview","click",()=>{STATE.view="path";render();});
  document.querySelectorAll("[data-rchoice]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      if(STATE.reviewSelected)return;
      const ch=btn.dataset.rchoice;
      STATE.reviewSelected=ch;
      const q=STATE.reviewQuiz[STATE.reviewQIndex];
      const correct=ch===q.answer;
      const day=q.sourceDay;
      if(!STATE.reviewDayResults[day]) STATE.reviewDayResults[day]={correct:0,total:0};
      STATE.reviewDayResults[day].total++;
      if(correct){
        STATE.reviewScore++;
        STATE.reviewDayResults[day].correct++;
        launchConfetti(20);
      }
      render();
    });
  });
  on("nextReviewQ","click",()=>{
    if(STATE.reviewQIndex+1>=STATE.reviewQuiz.length){
      finishReviewSession();
      if(STATE.reviewScore===STATE.reviewQuiz.length) launchConfetti(60);
      STATE.view="reviewResult";render();
    } else {
      STATE.reviewQIndex++;STATE.reviewSelected=null;render();
    }
  });
  on("backToPathFromReview","click",()=>{STATE.view="path";render();});
}

/* Sets up the correct day-path/continents for the chosen player,
   loads their own save data, and shows the map. */
async function selectProfile(profileId){
  STATE.profile=profileId;
  const {days,continents}=pathDataFor(profileId);
  ACTIVE_DAYS=days;
  ACTIVE_CONTINENTS=continents;
  const flagMapFrame=document.getElementById("flagMapFrame");
  if(flagMapFrame) flagMapFrame.dataset.loaded=""; // force Flag Map to reload under the new player's pool
  await loadState(profileId);
  STATE.view="path";
  render();
}

/* ── Pronunciation (speak the country name aloud) ── */
function speakCountryName(name,btnEl){
  if(!("speechSynthesis" in window) || !name) return;
  try{
    window.speechSynthesis.cancel();
    const utter=new SpeechSynthesisUtterance(name);
    utter.lang="en-US";
    utter.rate=0.85;
    if(btnEl){
      btnEl.classList.add("speaking");
      const clear=()=>btnEl.classList.remove("speaking");
      utter.onend=clear;
      utter.onerror=clear;
    }
    window.speechSynthesis.speak(utter);
  }catch(e){/* speech synthesis unavailable — fail silently */}
}


/* ── Boot ── */
(async function boot(){
  applyFont(currentFont());
  try{ if(localStorage.getItem("flagAtlasDevUnlocked")==="1") STATE.devMode=true; }catch(e){}
  render();
})();
</script>

<style>

input{font-family:inherit;}
.screen{position:fixed;inset:0;display:none;}

/* ---------- SETUP SCREEN ---------- */
#setup-screen.active{display:flex;flex-direction:column;overflow-y:auto;background:
  radial-gradient(circle at 20% 0%, rgba(255,200,0,0.20), transparent 45%),

  var(--void);}
.setup-wrap{max-width:640px;margin:0 auto;padding:28px 20px 100px;width:100%;}

.section-label{font-family:var(--font-mono);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--amber);font-weight:800;margin:0 0 10px;display:flex;align-items:center;gap:8px;}
.section-label::after{content:'';flex:1;height:2px;border-radius:2px;background:var(--hairline);}

.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.chip{border:1px solid var(--hairline);background:var(--panel);color:var(--text-mut);border-radius:999px;padding:8px 16px;font-size:13px;font-weight:700;transition:all .15s;}
.chip.on{background:rgba(255,200,0,0.22);border-color:var(--amber);color:var(--amber);}
.chip.partial{border-style:dashed;color:var(--text-hi);}

.pool-count{font-family:var(--font-mono);font-size:13px;color:var(--text-mut);font-weight:700;margin-bottom:18px;}
.pool-count b{color:var(--amber);}

.adv-toggle{background:var(--panel);border:1px solid var(--hairline);color:var(--text-mut);border-radius:8px;padding:10px 14px;font-size:13px;width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-weight:700;}
.adv-toggle:active{border-color:var(--cyan);}
.adv-panel{display:none;border:1px solid var(--hairline);border-radius:10px;padding:12px;margin-bottom:20px;background:var(--panel);}
.adv-panel.open{display:block;}
.adv-panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.adv-panel-title{font-family:var(--font-mono);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-mut);font-weight:800;}
.adv-close{background:none;border:1px solid var(--hairline);color:var(--text-mut);border-radius:6px;width:26px;height:26px;font-size:13px;line-height:1;flex:none;display:flex;align-items:center;justify-content:center;}
.adv-close:active{border-color:var(--cyan);color:var(--cyan);}
.adv-actions{display:flex;gap:8px;margin-bottom:10px;}
.adv-action-btn{background:rgba(124,58,237,0.18);border:1px solid var(--hairline);color:var(--text-mut);border-radius:8px;padding:7px 12px;font-size:12px;font-weight:700;}
.adv-action-btn:active{border-color:var(--red);color:var(--red);}
.adv-search{width:100%;background:var(--panel);border:1px solid var(--hairline);border-radius:8px;padding:9px 12px;color:var(--text-hi);font-size:14px;margin-bottom:10px;}
.adv-search::placeholder{color:var(--text-mut);}
.country-list{max-height:280px;overflow-y:auto;}
.country-group-h{font-family:var(--font-mono);font-size:10px;letter-spacing:1.5px;color:var(--text-mut);text-transform:uppercase;margin:12px 0 6px;font-weight:700;}
.country-row{display:flex;align-items:center;gap:10px;padding:6px 4px;border-radius:6px;font-size:14px;}
.country-row img{width:22px;height:16px;object-fit:cover;border-radius:2px;flex:none;background:#3D2E66;}
.country-row input{accent-color:var(--cyan);width:16px;height:16px;flex:none;}

.round-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}

.round-btn.on{border-color:var(--amber);background:rgba(255,200,0,0.22);color:var(--amber);}
.custom-count-wrap{display:none;margin-bottom:20px;}
.custom-count-wrap.open{display:block;}
.custom-count-wrap input{width:100%;background:var(--panel);border:1px solid var(--hairline);border-radius:8px;padding:10px 12px;color:var(--text-hi);font-size:15px;}

.start-btn{position:fixed;left:0;right:0;bottom:0;padding:16px 20px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,#1a0533 30%);}
#begin-btn{width:100%;max-width:600px;margin:0 auto;display:block;background:var(--cyan);color:#fff;border:2px solid #5B21B6;border-radius:14px;padding:16px;font-size:17px;font-weight:800;letter-spacing:0.5px;box-shadow:0 5px 0 #5B21B6;transition:transform .08s,box-shadow .08s;}

.setup-note{font-size:12px;color:var(--text-mut);margin-top:8px;text-align:center;}

/* ---------- SETUP WIZARD ---------- */
.step-indicator{display:flex;align-items:center;justify-content:center;margin:0 0 24px;}

.wizard-bar{display:flex;gap:10px;}

.camera-preview-slot{width:100%;max-width:380px;height:44vh;min-height:260px;margin:0 auto 14px;display:flex;flex-direction:column;}

/* ---------- FACE FRAMING GUIDE ---------- */

.face-guide.show{display:flex;}
.face-guide-ring{width:52%;aspect-ratio:0.8;border-radius:50%;border:4px dashed rgba(255,255,255,0.85);box-shadow:0 0 0 999px rgba(10,5,26,0.35);transition:border-color .25s, box-shadow .25s;}

/* ---------- GAME SCREEN ---------- */
#game-screen{background:
  radial-gradient(circle at 15% 5%, rgba(255,200,0,0.18), transparent 45%),
  radial-gradient(circle at 90% 95%, rgba(88,204,2,0.15), transparent 45%),

#cam-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#231447;}

#no-cam-bg{position:absolute;inset:0;background:
  radial-gradient(circle at 30% 20%, rgba(255,200,0,0.20), transparent 50%),
